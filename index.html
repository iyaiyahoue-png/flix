<style>
:root{color-scheme:dark;--bg:#0b0d12;--card:#14171f;--text:#e8eaf0;--sub:#8a90a2;--line:#262b38;--main:#8b7cf6;--main2:#a29bfe;--red:#f0587c}
/* 着せ替え（テーマ）。data-theme を付けた要素の中は、その色になる */
[data-theme="th_dark"]{--bg:#0b0d12;--card:#14171f;--text:#e8eaf0;--sub:#8a90a2;--line:#262b38;--main:#8b7cf6;--main2:#a29bfe;--red:#f0587c}
[data-theme="th_white"]{color-scheme:light;--bg:#f2f4f8;--card:#ffffff;--text:#14171f;--sub:#667085;--line:#e1e5ee;--main:#6c5ce7;--main2:#7d6ff0;--red:#e5457a}
[data-theme="th_ocean"]{--bg:#071a2b;--card:#0d2740;--text:#e6f3ff;--sub:#7fa3c4;--line:#17395a;--main:#1e90e8;--main2:#4fb0ff;--red:#ff6b8b}
[data-theme="th_mint"]{color-scheme:light;--bg:#eaf8f4;--card:#ffffff;--text:#12312b;--sub:#5d8a80;--line:#cdebe3;--main:#0f9d8e;--main2:#14b8a6;--red:#e5457a}
[data-theme="th_forest"]{--bg:#0a1710;--card:#10241a;--text:#e7f4ea;--sub:#86a891;--line:#1c3a2a;--main:#2fb67a;--main2:#4fd699;--red:#f0587c}
[data-theme="th_sakura"]{color-scheme:light;--bg:#fff0f4;--card:#ffffff;--text:#3a2230;--sub:#9a6f82;--line:#f4d3de;--main:#e5497f;--main2:#f283ab;--red:#d63a6a}
[data-theme="th_sunset"]{--bg:#1d0f1a;--card:#2a1624;--text:#ffeede;--sub:#c79a9a;--line:#4a2638;--main:#f0662f;--main2:#ff9a6b;--red:#ff4d6d}
[data-theme="th_neon"]{--bg:#05050d;--card:#0d0d1c;--text:#f2f2ff;--sub:#8f8fc0;--line:#26264d;--main:#9333ea;--main2:#00e5ff;--red:#ff2bd6}
[data-theme="th_gold"]{--bg:#14110a;--card:#1f1a0e;--text:#fff6dc;--sub:#b8a572;--line:#3a2f14;--main:#c98e00;--main2:#ffd34d;--red:#ff6b5b}
html[data-theme]{background:var(--bg)}
.th-prev{width:100%;aspect-ratio:16/10;border-radius:12px;background:var(--bg);border:1px solid var(--line);padding:8px;display:flex;flex-direction:column;gap:5px;margin-bottom:6px}
.th-prev i{display:block;border-radius:6px;background:var(--card);border:1px solid var(--line);flex:1}
.th-prev b{display:block;height:9px;width:45%;border-radius:5px;background:var(--main)}
.th-prev u{display:block;height:6px;width:70%;border-radius:4px;background:var(--sub);opacity:.6}
.vf{width:1.05em;height:1.05em;vertical-align:-.17em;margin-left:4px;flex-shrink:0;display:inline-block}
/* ロッカー */
.lk-modal{max-width:420px}
.lk-body{padding:14px 16px 6px;max-height:75vh;overflow-y:auto}
.locker{container-type:inline-size;position:relative;width:100%;max-width:330px;aspect-ratio:3/4;margin:0 auto 12px;border:7px solid #8e98ab;border-radius:14px;overflow:hidden;box-shadow:inset 0 0 18px rgba(0,0,0,.35),0 4px 14px rgba(0,0,0,.3);user-select:none;-webkit-user-select:none}
.locker.editing{touch-action:none;outline:2px dashed var(--main2);outline-offset:3px}
.lk-vent{position:absolute;left:0;right:0;top:0;height:9%;display:flex;gap:4%;justify-content:center;align-items:center;background:rgba(0,0,0,.22);z-index:0;pointer-events:none}
.lk-vent i{display:block;width:16%;height:22%;border-radius:4px;background:rgba(0,0,0,.45)}
.lk-item{position:absolute;transform:translate(-50%,-50%) rotate(var(--r,0deg));font-size:calc(var(--s,1) * 17cqw);line-height:1;filter:drop-shadow(0 2px 2px rgba(0,0,0,.35))}
.locker.editing .lk-item{cursor:grab;touch-action:none}
.lk-item.sel{outline:2px dashed #fff;outline-offset:3px;border-radius:8px;background:rgba(255,255,255,.12)}
.lk-empty{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;text-align:center;color:rgba(255,255,255,.75);font-weight:700;font-size:14px;line-height:1.7;padding:20px}
.lkb-gray{background:linear-gradient(180deg,#5c6578,#454d5e)}
.lkb-stripe{background:repeating-linear-gradient(90deg,#3b82f6 0 10%,#dbeafe 10% 20%)}
.lkb-sky{background:linear-gradient(180deg,#5ab3ff,#d4eeff 70%,#eaf7e1)}
.lkb-pink{background:linear-gradient(180deg,#ff9ec4,#ffd6e7)}
.lkb-wood{background:repeating-linear-gradient(0deg,#a8743c 0 12px,#9a6733 12px 14px)}
.lkb-checker{background:conic-gradient(#f4f4f4 25%,#2b2f3a 0 50%,#f4f4f4 0 75%,#2b2f3a 0) 0 0/20% 15%}
.lkb-space{background:radial-gradient(circle at 20% 25%,#fff 0 1px,transparent 2px),radial-gradient(circle at 70% 60%,#fff 0 1px,transparent 2px),radial-gradient(circle at 40% 85%,#fff 0 1px,transparent 2px),radial-gradient(circle at 85% 15%,#fff 0 1.5px,transparent 2.5px),linear-gradient(180deg,#0a0638,#2a0f5c)}
.lkb-gold{background:linear-gradient(135deg,#8a6200,#ffd34d 40%,#b8860b 60%,#ffe58a)}
.lk-ctl{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin:6px 0}
.lk-tools{display:flex;gap:6px;justify-content:center;margin:2px 0 6px;flex-wrap:wrap}
.lk-tools button{min-width:44px;padding:8px 10px;border:1px solid var(--line);background:var(--bg);color:var(--text);border-radius:10px;font-size:15px;font-weight:700}
.lk-hint{text-align:center;font-size:12px;color:var(--sub);margin-bottom:6px}
.lk-sec{font-size:12px;color:var(--sub);font-weight:700;margin:8px 0 4px}
.lk-tray{display:flex;flex-wrap:wrap;gap:6px}
.lk-tray button{width:46px;height:46px;border:1px solid var(--line);background:var(--bg);border-radius:10px;font-size:24px;display:flex;align-items:center;justify-content:center;padding:0}
.lk-tray button.on{border-color:var(--main);box-shadow:0 0 0 2px var(--main)}
.lk-swatch{width:100%;aspect-ratio:3/4;border-radius:10px;max-height:110px;margin:0 auto 6px;border:1px solid var(--line)}
.lk-swatch.sm{width:30px;height:30px;aspect-ratio:auto;max-height:none;margin:0;border-radius:6px}
.lk-ico{font-size:54px;text-align:center;line-height:1.3;margin-bottom:4px}
.frm.sq,.avatar .frm.sq{border-radius:28%}
.frm.sq.f-gold,.frm.sq.f-flame,.frm.sq.f-aurora,.frm.sq.f-rainbow,.frm.sq.f-legend,.frm.sq.f-ice,.frm.sq.f-sakura,.frm.sq.f-galaxy,.frm.sq.f-royal{padding:var(--rw);-webkit-mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);-webkit-mask-composite:xor;mask:linear-gradient(#000 0 0) content-box exclude,linear-gradient(#000 0 0);mask-composite:exclude;animation:frmHue 4s linear infinite}
@keyframes frmHue{to{filter:hue-rotate(360deg)}}
.frozen-tag{display:inline-block;margin:2px 0 6px;padding:2px 12px;border-radius:14px;background:rgba(96,165,250,.18);color:#60a5fa;font-weight:700;font-size:13px}
.modbox{margin:8px 0}
.tag{color:var(--main2);font-weight:700;cursor:pointer;text-decoration:none}
.tag:hover{text-decoration:underline}
.search-box{padding:12px 16px;border-bottom:1px solid var(--line)}
.search-box input{width:100%;padding:11px 16px;border:1px solid var(--line);border-radius:22px;background:var(--bg);color:var(--text);font-size:15px}
.s-sec{padding:14px 20px 6px;font-weight:800;font-size:14px;border-top:8px solid var(--bg)}
.s-sec small{color:var(--sub);font-weight:600;margin-left:6px}
.tchips{display:flex;flex-wrap:wrap;gap:8px;padding:6px 20px 14px}
.tchips .chip{padding:6px 14px;border:1px solid var(--line);border-radius:18px;background:var(--bg)}
.tchips .chip small{color:var(--sub);margin-left:6px;font-weight:600}
/* 追加のフレーム・飾り */
.f-lime{box-shadow:inset 0 0 0 var(--rw) #a3e635}
.f-grape{box-shadow:inset 0 0 0 var(--rw) #a78bfa}
.f-sunset{box-shadow:inset 0 0 0 var(--rw) #fb923c,inset 0 0 0 calc(var(--rw)*2) #f472b6}
.f-dots{border:var(--rw) dotted #fff;box-sizing:border-box}
.f-emerald{box-shadow:inset 0 0 0 var(--rw) #34d399,0 0 10px 2px #10b981;animation:frmPulse 2s ease-in-out infinite}
.f-ice{background:conic-gradient(#e0f2fe,#38bdf8,#fff,#7dd3fc,#e0f2fe)}
.f-sakura{background:conic-gradient(#ffd1e3,#fff,#f9a8d4,#fff,#ffd1e3);animation:frmSpin 8s linear infinite}
.f-galaxy{--rw:4px;background:conic-gradient(#312e81,#7c3aed,#ec4899,#38bdf8,#312e81);animation:frmSpin 3.5s linear infinite}
.f-royal{--rw:4px;background:conic-gradient(#facc15,#7c3aed,#facc15,#7c3aed,#facc15);animation:frmSpin 4s linear infinite}
.x-hat_sprout::before{content:'🌱'}
.x-hat_straw::before{content:'👒'}
.x-hat_sunflower::before{content:'🌻'}
.x-hat_helmet::before{content:'🪖'}
.x-hat_bunny{background:none}
.x-hat_bunny::before,.x-hat_bunny::after{content:'';position:absolute;top:calc(var(--d)*-.12);width:calc(var(--d)*.15);height:calc(var(--d)*.46);border-radius:50%;background:#fff;box-shadow:inset 0 0 0 calc(var(--d)*.04) #f9a8d4;border:1px solid #e5e7eb}
.x-hat_bunny::before{left:calc(var(--d)*.1);transform:rotate(-12deg)}
.x-hat_bunny::after{right:calc(var(--d)*.1);transform:rotate(12deg)}
.x-hat_horns{background:none}
.x-hat_horns::before,.x-hat_horns::after{content:'';position:absolute;top:calc(var(--d)*.2);width:0;height:0;border-left:calc(var(--d)*.1) solid transparent;border-right:calc(var(--d)*.1) solid transparent;border-bottom:calc(var(--d)*.3) solid #ef4444}
.x-hat_horns::before{left:calc(var(--d)*.06);transform:rotate(-28deg)}
.x-hat_horns::after{right:calc(var(--d)*.06);transform:rotate(28deg)}
.x-bdg_moon::before{content:'🌙'}
.x-bdg_sun::before{content:'☀️'}
.x-bdg_book::before{content:'📚'}
.x-bdg_pizza::before{content:'🍕'}
.x-bdg_ghost::before{content:'👻'}
.x-bdg_rocket::before{content:'🚀'}
.x-bdg_dragon::before{content:'🐉'}
.x-bdg_unicorn::before{content:'🦄'}
.x-fx_green{box-shadow:0 0 calc(var(--d)*.28) calc(var(--d)*.05) #4ade80;animation:frmPulse 1.8s ease-in-out infinite}
.x-fx_red{box-shadow:0 0 calc(var(--d)*.28) calc(var(--d)*.05) #f87171;animation:frmPulse 1.8s ease-in-out infinite}
.x-fx_purple{box-shadow:0 0 calc(var(--d)*.28) calc(var(--d)*.05) #c084fc;animation:frmPulse 1.8s ease-in-out infinite}
.x-fx_rainbow{box-shadow:0 0 calc(var(--d)*.3) calc(var(--d)*.06) #ff5ea0;animation:fxRainbow 3s linear infinite}
@keyframes fxRainbow{0%{box-shadow:0 0 calc(var(--d)*.3) calc(var(--d)*.06) #ff5ea0}20%{box-shadow:0 0 calc(var(--d)*.3) calc(var(--d)*.06) #ffd000}40%{box-shadow:0 0 calc(var(--d)*.3) calc(var(--d)*.06) #00e676}60%{box-shadow:0 0 calc(var(--d)*.3) calc(var(--d)*.06) #00b0ff}80%{box-shadow:0 0 calc(var(--d)*.3) calc(var(--d)*.06) #d500f9}100%{box-shadow:0 0 calc(var(--d)*.3) calc(var(--d)*.06) #ff5ea0}}
.x-fx_bubbles::before,.x-fx_bubbles::after,.x-fx_leaf::before,.x-fx_leaf::after,.x-fx_stars::before,.x-fx_stars::after{position:absolute;font-size:calc(var(--d)*.26)}
.x-fx_bubbles::before{content:'🫧';right:calc(var(--d)*-.05);bottom:calc(var(--d)*.3);animation:fxUp 2.6s ease-in infinite}
.x-fx_bubbles::after{content:'🫧';left:calc(var(--d)*.05);bottom:calc(var(--d)*.3);animation:fxUp 2.6s ease-in 1.3s infinite}
.x-fx_leaf::before{content:'🍃';left:calc(var(--d)*.1);top:calc(var(--d)*-.1);animation:fxDown 2.8s linear infinite}
.x-fx_leaf::after{content:'🍂';right:calc(var(--d)*.1);top:calc(var(--d)*-.1);animation:fxDown 2.8s linear 1.4s infinite}
.x-fx_stars::before{content:'⭐';right:calc(var(--d)*-.05);bottom:calc(var(--d)*.3);animation:fxUp 2.2s ease-in infinite}
.x-fx_stars::after{content:'🌟';left:calc(var(--d)*.05);bottom:calc(var(--d)*.3);animation:fxUp 2.2s ease-in 1.1s infinite}
*{box-sizing:border-box}
body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Noto Sans JP",sans-serif;background:var(--bg);color:var(--text)}
button{font:inherit;cursor:pointer}
input,textarea,select{font:inherit;color:inherit;background:var(--bg)}
.hidden{display:none!important}

/* auth */
#auth{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px;background:var(--bg)}
.auth-box{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:32px;width:100%;max-width:380px}
.logo{font-size:28px;font-weight:800;color:var(--main);margin:0 0 4px}
.tag{color:var(--sub);font-size:13px;margin:0 0 20px}
.tabs{display:flex;gap:8px;margin-bottom:16px}
.tabs button{flex:1;padding:10px;border:none;border-radius:10px;background:var(--bg);color:var(--sub);font-weight:700}
.tabs button.on{background:var(--main);color:#0b0d12}
.field{margin-bottom:12px}
.field label{display:block;font-size:12px;color:var(--sub);margin-bottom:4px}
.field input,.field textarea{width:100%;padding:11px 12px;border:1px solid var(--line);border-radius:10px;outline:none;resize:none}
.field input:focus,.field textarea:focus{border-color:var(--main)}
.btn{width:100%;padding:12px;border:none;border-radius:12px;background:var(--main);color:#0b0d12;font-weight:700}
.btn:hover{opacity:.9}
.err{color:var(--red);font-size:13px;min-height:18px;margin:6px 0}
.note{font-size:12px;color:var(--sub);margin-top:12px;line-height:1.6}

/* app layout */
#app{display:flex;min-height:100vh;max-width:1000px;margin:0 auto}
nav{width:230px;padding:20px 12px;position:sticky;top:0;height:100vh;display:flex;flex-direction:column;gap:4px;border-right:1px solid var(--line);background:var(--card)}
nav .logo{padding:0 12px 16px}
.nav-item{display:flex;align-items:center;gap:12px;padding:12px 14px;border:none;background:none;border-radius:12px;font-size:16px;text-align:left;font-weight:600;color:var(--text);position:relative}
.nav-item:hover{background:var(--bg)}
.nav-item.on{background:rgba(139,124,246,.16);color:var(--main)}
.nav-item .ic{font-size:20px;width:24px;text-align:center}
.badge{background:var(--red);color:#fff;border-radius:10px;font-size:11px;padding:1px 7px;margin-left:auto}
.nav-post{margin-top:12px}
main{flex:1;min-width:0;max-width:640px;border-right:1px solid var(--line);background:var(--card);min-height:100vh}
.head{position:sticky;top:0;z-index:5;background:rgba(20,23,31,.9);backdrop-filter:blur(8px);padding:16px 20px;font-weight:800;font-size:18px;border-bottom:1px solid var(--line)}
aside{flex:1;padding:20px;min-width:0}
.side-card{background:var(--card);border-radius:16px;padding:16px;font-size:13px;color:var(--sub);line-height:1.7}
.side-card b{color:var(--text)}

/* compose */
.compose{padding:22px 20px 16px;border-bottom:8px solid var(--bg);display:flex;gap:12px;align-items:flex-start}
.compose-main{flex:1;min-width:0}
.compose textarea{background:transparent;width:100%;border:none;outline:none;resize:none;font-size:16px;min-height:70px}
.compose-row{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-top:8px}
.switch{display:flex;align-items:center;gap:6px;font-size:13px;color:var(--sub)}
.compose .send{margin-left:auto;width:auto;padding:8px 22px;border-radius:20px}
.count{font-size:12px;color:var(--sub)}

/* post */
.post{padding:16px 20px;border-bottom:1px solid var(--line)}
.post-top{display:flex;gap:12px}
.avatar.link,.who.link{cursor:pointer}
.who.link:hover{text-decoration:underline}
.avatar.sm{width:22px;height:22px;font-size:11px;display:inline-flex;margin-right:6px;vertical-align:middle}
.bio{white-space:pre-wrap;word-break:break-word;line-height:1.6;margin:8px auto 4px!important;max-width:420px;color:var(--text)!important}
.edit{text-align:left;max-width:420px;margin:0 auto}
.edit .avatar{margin:0 auto 10px!important}
.edit-btns{display:flex;gap:8px;justify-content:center;margin-bottom:16px}
.small-btn{padding:7px 16px;border:1px solid var(--line);background:var(--card);color:var(--text);border-radius:20px;font-size:13px;font-weight:700;cursor:pointer}
.btn-row{display:flex;gap:8px;margin-top:6px}
.btn-row .btn.ghost{background:var(--bg);color:var(--text);border:1px solid var(--line)}
.btn.inline{width:auto;padding:9px 26px;border-radius:20px;margin-top:12px}
.avatar{--d:42px;position:relative;width:42px;height:42px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:20px;flex-shrink:0;color:#fff;font-weight:700}
.post-body{flex:1;min-width:0}
.who{font-weight:700;font-size:15px}
.meta{color:var(--sub);font-size:12px;font-weight:400;margin-left:6px}
.more-btn{color:var(--main);cursor:pointer;font-size:.9em;white-space:nowrap}.more-btn:hover{text-decoration:underline}[hidden]{display:none!important}
.text{margin:6px 0 10px;white-space:pre-wrap;word-break:break-word;line-height:1.6}
.actions{display:flex;gap:24px}
.act{border:none;background:none;color:var(--sub);display:flex;align-items:center;gap:6px;font-size:14px;padding:4px 0}
.act:hover{color:var(--main)}
.act.liked{color:var(--red)}
.act.del:hover{color:var(--red)}
.comments{margin:12px 0 0 54px;border-left:2px solid var(--line);padding-left:12px}
.comment{padding:8px 0;font-size:14px}
.comment .who{font-size:13px}
.cform{display:flex;gap:8px;margin-top:8px}
.cform input{flex:1;min-width:0;padding:8px 12px;border:1px solid var(--line);border-radius:20px;outline:none}
.cform button{flex-shrink:0;white-space:nowrap;padding:8px 16px;border:none;border-radius:20px;background:var(--main);color:#fff;font-weight:700}
.empty{padding:60px 20px;text-align:center;color:var(--sub)}

/* notif / dm / profile */
.notif{padding:14px 20px;border-bottom:1px solid var(--line);display:flex;gap:12px;align-items:center}
.notif.new{background:rgba(139,124,246,.1)}
.conv{padding:14px 20px;border-bottom:1px solid var(--line);display:flex;gap:12px;align-items:center;cursor:pointer}
.conv:hover{background:var(--bg)}
.dm-new{display:flex;gap:8px;padding:14px 20px;border-bottom:8px solid var(--bg)}
.dm-new input{flex:1;padding:10px 12px;border:1px solid var(--line);border-radius:10px;outline:none}
.dm-new button{padding:10px 18px;border:none;border-radius:10px;background:var(--main);color:#fff;font-weight:700}
.chat{padding:16px 20px;display:flex;flex-direction:column;gap:8px;min-height:50vh}
.bubble{max-width:75%;padding:9px 14px;border-radius:16px;line-height:1.5;word-break:break-word;white-space:pre-wrap}
.bubble.me{align-self:flex-end;background:var(--main);color:#fff;border-bottom-right-radius:4px}
.bubble.you{align-self:flex-start;background:var(--line);border-bottom-left-radius:4px}
.chat-form{display:flex;gap:8px;padding:12px 16px;align-items:center;width:100%}
.chat-form input{flex:1;min-width:0;padding:10px 14px;border:1px solid var(--line);border-radius:20px;outline:none}
.chat-form .small-btn,.chat-form button{white-space:nowrap;flex-shrink:0}
.chat-form button{padding:10px 18px;border:none;border-radius:20px;background:var(--main);color:#fff;font-weight:700}
.back{border:none;background:none;color:var(--main);font-weight:700;padding:0;margin-right:10px}
.profile-top{padding:28px 20px;text-align:center;border-bottom:8px solid var(--bg)}

/* ===== アイコンフレーム（アバターの内側にリングを描く） ===== */
.frm{position:absolute;inset:0;border-radius:50%;pointer-events:none;--rw:3px;z-index:1}

.f-white{box-shadow:inset 0 0 0 var(--rw) #fff}
.f-mint{box-shadow:inset 0 0 0 var(--rw) #5eead4}
.f-sky{box-shadow:inset 0 0 0 var(--rw) #60a5fa}
.f-rose{box-shadow:inset 0 0 0 var(--rw) #fff,inset 0 0 0 calc(var(--rw)*2) #f472b6}
.f-gold,.f-flame,.f-aurora,.f-rainbow,.f-legend,.f-ice,.f-sakura,.f-galaxy,.f-royal{
  -webkit-mask:radial-gradient(farthest-side,transparent calc(100% - var(--rw)),#000 calc(100% - var(--rw) + .5px));
  mask:radial-gradient(farthest-side,transparent calc(100% - var(--rw)),#000 calc(100% - var(--rw) + .5px))}
.f-gold{background:conic-gradient(#fff3b0,#e0a800,#fff3b0,#b8860b,#fff3b0)}
.f-neon{box-shadow:inset 0 0 0 var(--rw) #22d3ee,inset 0 0 10px 3px #22d3ee;animation:frmPulse 1.6s ease-in-out infinite}
.f-flame{background:conic-gradient(#ff3d00,#ffb300,#ff3d00,#ffd54f,#ff3d00);animation:frmSpin 2.4s linear infinite,frmFlick .5s ease-in-out infinite alternate}
.f-aurora{background:conic-gradient(#34d399,#60a5fa,#a78bfa,#f472b6,#34d399);animation:frmSpin 6s linear infinite}
.f-rainbow{--rw:4px;background:conic-gradient(#ff0000,#ffd000,#00e676,#00b0ff,#d500f9,#ff0000);animation:frmSpin 2.5s linear infinite}
.avatar.sm .f-rainbow,.avatar.sm .f-legend,.avatar.sm .f-galaxy,.avatar.sm .f-royal{--rw:3px}
.profile-top .f-rainbow,.profile-top .f-legend,.avatar.big .f-rainbow,.avatar.big .f-legend{--rw:7px}
.f-legend{--rw:4px;background:conic-gradient(#fff,#ffd700,#ff8c00,#ffd700,#fff,#ffd700,#ff8c00,#ffd700,#fff);animation:frmSpin 3s linear infinite}
.f-legend::after{content:'✦';position:absolute;top:2%;right:6%;font-size:12px;color:#fff;text-shadow:0 0 6px #ffd700;animation:frmTwinkle 1.2s ease-in-out infinite}
.avatar.sm .f-legend::after{display:none}
@keyframes frmSpin{to{transform:rotate(360deg)}}
@keyframes frmPulse{50%{opacity:.55}}
@keyframes frmFlick{to{filter:brightness(1.35) saturate(1.2)}}
@keyframes frmTwinkle{50%{opacity:.2;transform:scale(.6)}}

.x-fx_sparkle::before,.x-fx_sparkle::after,.x-fx_hearts::before,.x-fx_hearts::after,.x-fx_snow::before,.x-fx_snow::after,.x-fx_sakura::before,.x-fx_sakura::after{position:absolute;font-size:calc(var(--d)*.26)}

'use strict';

/* ========== 基本 ========== */
const $ = s => document.querySelector(s);
const esc = s => String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function hash(s){ let h = 5381; for(const c of String(s)) h = ((h<<5)+h) ^ c.charCodeAt(0); return h>>>0; }
const colors = ['#6c5ce7','#00b894','#e17055','#0984e3','#e84393','#d6a12e','#00cec9','#d63031'];
const colorOf = s => colors[hash(s) % colors.length];
function ago(ts){
  const s = (Date.now()-ts)/1000;
  if(s<60) return 'たった今'; if(s<3600) return Math.floor(s/60)+'分前';
  if(s<86400) return Math.floor(s/3600)+'時間前'; return Math.floor(s/86400)+'日前';

function toast(t){ const e=$('#toast'); e.textContent=t; e.classList.add('show'); clearTimeout(toast.t); toast.t=setTimeout(()=>e.classList.remove('show'),2400); }
const NAME_MAX = 15;
const NAME_BAD = /[\u0000-\u001f\u007f-\u009f\u00a0\u00ad\u1680\u180e\u2000-\u200c\u200e-\u202f\u205f-\u206f\u3000\ufeff\ufff9-\ufffc]/;

const avTxt = u => (hasAv(u) ? '' : esc([...(u.name||'?')][0].toUpperCase())) + decoHTML(u) + `<i class="dot" data-uid="${esc(u.id || '')}"></i>`;

/* エラー文を日本語にする */
function errMsg(e){
  const m = (e && e.message) || String(e);
  if(/banned/i.test(m)) return 'このアカウントはbotの疑いで停止されています。解除してほしいときは管理者に連絡してください';
  if(/Invalid login credentials/i.test(m)) return 'メールアドレスかパスワードが違います';
  if(/already registered|already been registered/i.test(m)) return 'このメールアドレスは登録済みです';
  if(/Database error saving new user/i.test(m)) return '登録できませんでした。メールアドレスに「fzk」が入っているか、ユーザー名を確認してください（削除されたアカウントのメールアドレスは使えません）';
  if(/rate limit|too many requests|over_request_rate/i.test(m)) return 'しばらく待ってからもう一度試してください';
  if(/Failed to fetch|NetworkError|Load failed/i.test(m)) return 'ネットにつながりません';
  if(/Password should be at least/i.test(m)) return 'パスワードは6文字以上にしてください';
  if(/profiles_name_uniq/i.test(m)) return 'その名前は使われています';
  if(/profiles_name_fmt/i.test(m)) return NAME_MSG;
  if(/text_or_image/i.test(m)) return '内容を入力してください';
  if(/follows_not_self/i.test(m)) return '自分はフォローできません';
  if(/maximum allowed size|payload too large|entity too large/i.test(m)) return '画像が大きすぎます';
  if(/mime type/i.test(m)) return 'この形式の画像は使えません';
  if(/row-level security|permission denied/i.test(m)) return 'この操作はできません';
  return m;
}
function fail(e){
  const m = (e && e.message) || '';
  if(/JWT|Invalid Refresh Token|not authenticated/i.test(m) && me){ doLogout(true); return 'ログインし直してください'; }
  return errMsg(e);
}
async function q(promise){ const r = await promise; if(r.error) throw r.error; return r.data; }
async function cnt(promise){ const r = await promise; if(r.error) throw r.error; return r.count || 0; }

/* ========== 状態 ========== */
let sb = null;
let me = null;                       // {id, email, name, bio, avatar}
let isAdmin = false, isGold = false;                 // 管理者か（画面の表示用。本当の判定はデータベース側）

let feed = [], myFollowing = new Set(), profile = null, notifs = [], convs = [], chat = null, chatShown = null;
let unread = 0, unreadDM = 0, pendingScroll = null;

const U = id => PROF[id] || { id, name:'?', avatar:null, bio:'' };

async function ensureProfiles(ids){
  const now = Date.now();
  const need = [...new Set(ids)].filter(id => id && (!PROF[id] || now - PROF[id].t > 120000));
  if(!need.length) return;
  const rows = await q(sb.from('profiles').select('id,name,bio,avatar,verified,gold,is_admin,frozen_until,frame,hat,badge,effect,pfx').in('id', need));
  rows.forEach(p => PROF[p.id] = Object.assign({}, p, { t: now }));
}
const normPost = p => ({
  id: p.id, text: p.text, images: p.image_paths || [], views: p.impressions || 0, cast: p.cast_mode || null, cat: p.created_at, ts: Date.parse(p.created_at), uid: p.user_id,
  likes: (p.likes || []).map(l => l.user_id),
  comments: (p.comments || []).map(c => ({ id:c.id, text:c.text, ts:Date.parse(c.created_at), uid:c.user_id, parent:c.parent_id || null, likes:(c.comment_likes || []).map(l => l.user_id) })).sort((a,b)=>a.ts-b.ts)
});
const PSEL = 'id,text,image_paths,impressions,cast_mode,created_at,user_id,likes(user_id),comments(id,text,created_at,user_id,parent_id,comment_likes(user_id))';

/* ========== 画像（非公開の置き場所に保存し、見るときだけ期限つきのURLを発行） ========== */
const signed = {};                   // 保存場所 → {url, exp}
async function signPaths(paths){
  const now = Date.now();
  const need = [...new Set(paths)].filter(p => p && (!signed[p] || signed[p].exp - now < 600000));
  for(let i = 0; i < need.length; i += 50){
    const r = await sb.storage.from(BUCKET).createSignedUrls(need.slice(i, i + 50), 86400);
    if(r.error) throw r.error;
    (r.data || []).forEach(x => { if(x && x.signedUrl && x.path) signed[x.path] = { url: x.signedUrl, exp: now + 86400000 }; });
  }
}
const trySign = async paths => { try{ await signPaths(paths.filter(Boolean)); }catch(e){} };
const imgUrl = p => (signed[p] && signed[p].url) || '';
const imgTag = (path, cls) => { const u = imgUrl(path); return u ? `<img class="${cls}" src="${esc(u)}" alt="" loading="lazy" onclick="openImg(this.src)">` : `<div class="imgload">画像を読み込めません</div>`; };

function uuid4(){
  if(window.crypto && crypto.randomUUID) return crypto.randomUUID();
  const b = crypto.getRandomValues(new Uint8Array(16)); b[6] = (b[6] & 15) | 64; b[8] = (b[8] & 63) | 128;
  const h = [...b].map(x => x.toString(16).padStart(2, '0')).join('');
  return `${h.slice(0,8)}-${h.slice(8,12)}-${h.slice(12,16)}-${h.slice(16,20)}-${h.slice(20)}`;
}
function loadImg(file){
  return new Promise((res, rej) => {
    const u = URL.createObjectURL(file), i = new Image();
    i.onload = () => { URL.revokeObjectURL(u); res(i); };
    i.onerror = () => { URL.revokeObjectURL(u); rej(new Error('画像を読み込めませんでした')); };
    i.src = u;
  });
}
/* 選んだ画像を、長いほうの辺1280px・JPEGに小さくする（位置情報などの付加情報も消える） */
async function prepImage(file){
  if(!file || !/^image\//.test(file.type)) throw new Error('画像を選んでください');
  if(file.size > 40 * 1024 * 1024) throw new Error('画像が大きすぎます');
  const img = await loadImg(file);
  let side = 1280, quality = 0.82;
  for(let i = 0; i < 4; i++){
    const k = Math.min(1, side / Math.max(img.width, img.height));
    const w = Math.max(1, Math.round(img.width * k)), h = Math.max(1, Math.round(img.height * k));
    const c = document.createElement('canvas'); c.width = w; c.height = h;
    const x = c.getContext('2d'); x.fillStyle = '#fff'; x.fillRect(0, 0, w, h); x.drawImage(img, 0, 0, w, h);
    const blob = await new Promise(r => c.toBlob(r, 'image/jpeg', quality));
    if(blob && blob.size <= 2.5 * 1024 * 1024) return blob;
    side = Math.round(side * 0.75); quality = Math.max(0.55, quality - 0.1);
  }
  throw new Error('画像を小さくできませんでした');
}
async function uploadImg(blob){
  const path = `${me.id}/${uuid4()}.jpg`;
  const r = await sb.storage.from(BUCKET).upload(path, blob, { contentType:'image/jpeg', cacheControl:'31536000', upsert:false });
  if(r.error) throw r.error;
  return path;
}
const rmImg = path => Promise.resolve(sb.storage.from(BUCKET).remove([path])).catch(()=>{});

/* 添付する画像（投稿の入力欄 'main' 'm' は4枚まで、DM 'dm' は1枚） */
const cimg = {};                       // 入力欄ID → [{blob, url}, ...]
const maxImgs = id => id === 'dm' ? 1 : 4;
function showPrev(id){
  const pv = $('#pv-' + id); if(!pv) return;
  const list = cimg[id] || [];
  if(!list.length){ pv.classList.add('hidden'); pv.innerHTML = ''; return; }
  pv.classList.remove('hidden');
  pv.innerHTML = list.map((c, i) => `<div class="img-prev"><img src="${c.url}" alt=""><button type="button" class="x" onclick="dropImg('${id}', ${i})">×</button></div>`).join('') +
    (list.length > 1 || maxImgs(id) > 1 ? `<div class="meta" style="margin:0">${list.length}/${maxImgs(id)}枚</div>` : '');
}
function dropImg(id, idx){
  const list = cimg[id]; if(!list) { showPrev(id); return; }
  const gone = idx === undefined ? list.splice(0) : list.splice(idx, 1);
  gone.forEach(c => { try{ URL.revokeObjectURL(c.url); }catch(e){} });
  if(!list.length) delete cimg[id];
  showPrev(id);
}
function bindFile(id){
  const fin = $('#f-' + id); if(!fin) return;
  if(maxImgs(id) > 1) fin.multiple = true;
  fin.onchange = async () => {
    const files = [...fin.files]; fin.value = ''; if(!files.length) return;
    const max = maxImgs(id), have = (cimg[id] || []).length;
    let room = max - have, over = files.length > room;
    if(max === 1){ dropImg(id); room = 1; over = false; }
    for(const f of files.slice(0, Math.max(0, room))){
      try{
        const blob = await prepImage(f);
        (cimg[id] = cimg[id] || []).push({ blob, url: URL.createObjectURL(blob) });
        showPrev(id);
      }catch(e){ toast(e.message); }
    }
    if(over) toast('画像は' + max + '枚までです');
  };
  showPrev(id);
}
const galleries = {};                  // 投稿ID → 画像の保存場所の一覧（拡大表示で使う）
function galleryHTML(p){
  const ps = p.images || []; if(!ps.length) return '';
  galleries[p.id] = ps;
  const cells = ps.map((path, i) => { const u = imgUrl(path);
    return u ? `<img class="gimg" src="${esc(u)}" alt="" loading="lazy" onclick="openGallery('${p.id}', ${i})">` : `<div class="imgload">画像を読み込めません</div>`; }).join('');
  return `<div class="gallery g${ps.length}">${cells}</div>`;
}
let lbState = null;
function openGallery(pid, i){ lbState = { pid, i }; showLightbox(); }
function showLightbox(){
  const ps = galleries[lbState.pid] || [], u = imgUrl(ps[lbState.i]);
  const nav = ps.length > 1 ? `<button class="lbn l" onclick="event.stopPropagation();lbMove(-1)">‹</button><button class="lbn r" onclick="event.stopPropagation();lbMove(1)">›</button><div class="lbc">${lbState.i + 1} / ${ps.length}</div>` : '';
  $('#modalHost').innerHTML = `<div class="modal-bg" id="lb" onclick="closeModal()"><img class="lbimg" src="${esc(u)}" alt="">${nav}</div>`;
}
function lbMove(d){ const n = (galleries[lbState.pid] || []).length; if(!n) return; lbState.i = (lbState.i + d + n) % n; showLightbox(); }
document.addEventListener('keydown', e => { if(lbState && $('#lb')){ if(e.key === 'ArrowLeft') lbMove(-1); if(e.key === 'ArrowRight') lbMove(1); } });
function openImg(src){

}

/* ========== ログイン / 新規登録 ========== */
let mode = 'login';
function setMode(m){
  mode = m;
  $('#tabLogin').classList.toggle('on', m==='login');
  $('#tabSignup').classList.toggle('on', m==='signup');
  $('#fName').classList.toggle('hidden', m==='login');

}
$('#tabLogin').onclick = () => setMode('login');
$('#tabSignup').onclick = () => setMode('signup');
$('#authForm').onsubmit = async e => {
  e.preventDefault();
  const err = m => $('#aErr').textContent = m;
  if(!sb) return err(sbProblem || '設定がまだ終わっていません');
  const email = $('#aEmail').value.trim().toLowerCase();
  const password = $('#aPass').value;
  const name = $('#aName').value.trim();
  if(!email.includes('@')) return err('メールアドレスを正しく入力してください');
  if(password.length < 6) return err('パスワードは6文字以上にしてください');
  $('#aBtn').disabled = true; err('');
  try{
    if(mode === 'signup'){
      if(!email.includes('fzk')) throw new Error('校内専用です。メールアドレスに「fzk」を含む人だけ登録できます');
      if(!name) throw new Error('ユーザー名を入力してください');
      if(!NAME_RE.test(name)) throw new Error(NAME_MSG);
      const free = await q(sb.rpc('name_available', { n: name }));
      if(!free) throw new Error('そのユーザー名は使われています');
      const r = await sb.auth.signUp({ email, password, options: { data: { name } } });
      if(r.error) throw r.error;
      if(!r.data.session) throw new Error('登録を受け付けましたが、メールの確認が必要な設定になっています。管理者に Supabase の「Confirm email」をオフにしてもらってください');
    } else {
      const r = await sb.auth.signInWithPassword({ email, password });
      if(r.error) throw r.error;
    }
    await loadMe();
    start();
  }catch(ex){ err(errMsg(ex)); }
  $('#aBtn').disabled = false;
};

async function loadMe(){
  const { data } = await sb.auth.getSession();
  const user = data.session && data.session.user;
  if(!user) throw new Error('ログインできませんでした');
  const p = await q(sb.from('profiles').select('id,name,bio,avatar,verified,gold,is_admin,frozen_until,pinned_post_id,frame,hat,badge,effect,pfx,theme').eq('id', user.id).maybeSingle());
  if(!p) throw new Error('プロフィールが見つかりません');
  me = Object.assign({}, p, { email: user.email });
  PROF[me.id] = Object.assign({}, p, { t: Date.now() });
  applyTheme(p.theme);
  try{ const r = await sb.rpc('is_admin'); isAdmin = r.data === true; }catch(e){ isAdmin = false; }
  isGold = !!p.gold && !isAdmin;
  try{ myBlocks = new Set((await q(sb.from('blocks').select('blocked'))).map(r => r.blocked)); }catch(e){ myBlocks = new Set(); }
  if(isAdmin) setTimeout(drainTrash, 4000);
}
/* 自動そうじで消えたポストの画像ファイルを、管理者がサイトを開いたときにまとめて消す */
async function drainTrash(){
  if(!me || !isAdmin) return;
  try{
    for(let k = 0; k < 10; k++){
      const rows = await q(sb.rpc('admin_trash_list'));
      if(!rows || !rows.length) break;
      const paths = rows.map(r => r.path);
      for(let i = 0; i < paths.length; i += 50){ try{ await sb.storage.from('images').remove(paths.slice(i, i + 50)); }catch(e){} }
      await q(sb.rpc('admin_trash_clear', { paths }));
    }
  }catch(e){}
}
setInterval(() => { if(me && isAdmin && !document.hidden) drainTrash(); }, 3600000);

const TITLES = { home:'ホーム', search:'検索', notif:'通知', dm:'DM', quest:'クエスト', me:'プロフィール' };
const headHTML = t => `<div class="head">${t}</div>`;
const homeTop = () => headHTML('ホーム') + `<div id="onlineBox"></div>` +
  `<div class="subtabs"><button class="${homeTab==='all'?'on':''}" onclick="setTab('all')">すべて</button><button class="${homeTab==='following'?'on':''}" onclick="setTab('following')">フォロー中</button></div>`;

/* 画面を切り替える：読み込み中表示 → データ取得 → 描画 */
function go(){
  castStash();
  syncFab();
  const had = (view==='home' && feed.length) || (view==='me' && profile && profile.user.id===(profileId||me.id)) || (view==='notif' && notifs.length) || (view==='dm' && (dmWith ? chat : convs.length)) || (view==='quest' && fil);
  if(!had) $('#main').innerHTML = (view==='home' ? homeTop() : headHTML(TITLES[view])) + '<div class="empty">読み込み中…</div>';
  chatShown = null;
  refresh(false);
}

async function refresh(silent){
  const v = view, pid = profileId, dw = dmWith, tab = homeTab;
  if(!me) return;
  try{
    if(v === 'home'){
      if(!castSt) await castPoll(true);
      let rows;
      if(feedCtx !== 'home:' + tab){ feedCtx = 'home:' + tab; feedLimit = PAGE; }
      const lim = feedLimit;
      if(tab === 'following'){
        const f = await q(sb.from('follows').select('following_id').eq('follower_id', me.id));
        myFollowing = new Set(f.map(x => x.following_id));
        rows = await q(sb.from('posts').select(PSEL).in('user_id', [me.id, ...myFollowing]).order('created_at', { ascending:false }).limit(lim));
      } else {
        rows = await q(sb.from('posts').select(PSEL).order('created_at', { ascending:false }).limit(lim));
      }
      feedMoreNext = rows.length >= lim;
      const list = rows.map(normPost);
      let lp = null;                                         // 配信中のポストは、いつもホームの一番上に出す
      if(castSt && castSt.live && castSt.post_id){
        lp = list.find(p => p.id === castSt.post_id) || null;
        if(!lp){ const r1 = await q(sb.from('posts').select(PSEL).eq('id', castSt.post_id).maybeSingle()).catch(() => null); if(r1) lp = normPost(r1); }
      }
      await ensureProfiles(list.concat(lp ? [lp] : []).flatMap(p => [p.uid, ...p.comments.map(c => c.uid)]));
      await trySign(list.flatMap(p => p.images));
      if(view !== v || homeTab !== tab || !me) return;
      feed = list; feedMore = feedMoreNext; livePost = lp;
    }
    else if(v === 'search'){
      if(searchQ) await runSearch(searchQ); else await loadTrending();
      if(view !== v || !me) return;
    }
    else if(v === 'me'){
      const id = pid || me.id;
      if(profCtx !== 'me:' + id){ profCtx = 'me:' + id; profLimit = PAGE; }
      const plim = profLimit;
      const [rows, fers, fing, fol, npost, nlike, pinRow, blkRows] = await Promise.all([
        q(sb.from('posts').select(PSEL).eq('user_id', id).order('created_at', { ascending:false }).limit(plim)),
        cnt(sb.from('follows').select('follower_id', { count:'exact', head:true }).eq('following_id', id)),
        cnt(sb.from('follows').select('following_id', { count:'exact', head:true }).eq('follower_id', id)),
        id === me.id ? Promise.resolve(null) : q(sb.from('follows').select('following_id').eq('follower_id', me.id).eq('following_id', id).maybeSingle()),
        cnt(sb.from('posts').select('id', { count:'exact', head:true }).eq('user_id', id)),
        cnt(sb.from('likes').select('post_id,posts!inner(user_id)', { count:'exact', head:true }).eq('posts.user_id', id)).catch(() => -1),
        q(sb.from('profiles').select('pinned_post_id').eq('id', id).maybeSingle()).catch(() => null),
        q(sb.from('blocks').select('blocked')).catch(() => null)
      ]);
      if(blkRows) myBlocks = new Set(blkRows.map(r => r.blocked));
      const pinId = (pinRow && pinRow.pinned_post_id) || null;
      if(id === me.id){ me.pinned_post_id = pinId; }
      let pinned = null;
      if(pinId && !rows.some(r => r.id === pinId)){
        const pr = await q(sb.from('posts').select(PSEL).eq('id', pinId).maybeSingle()).catch(() => null);
        if(pr) pinned = normPost(pr);
      }
      PROF[id] && (PROF[id].t = 0);                 // プロフィールは毎回最新を取る
      await ensureProfiles([id]);
      const list = rows.map(normPost);
      await ensureProfiles(list.concat(pinned ? [pinned] : []).flatMap(p => p.comments.map(c => c.uid)));
      await trySign(list.concat(pinned ? [pinned] : []).flatMap(p => p.images));
      if(view !== v || profileId !== pid || !me) return;
      if(!PROF[id]) throw new Error('ユーザーが見つかりません');
      profile = { user: PROF[id], own: id === me.id, posts: list, nposts: npost, likes: nlike >= 0 ? nlike : list.reduce((s,p) => s + p.likes.length, 0), followers: fers, following: fing, followed: !!fol, pinId, pinned, blocked: myBlocks.has(id) };
      profMore = rows.length >= plim;
    }
    else if(v === 'notif'){
      const rows = await q(sb.from('notifications').select('id,type,post_id,text,read,created_at,from_user,post:posts(text,image_paths)').order('created_at', { ascending:false }).limit(100));
      await ensureProfiles(rows.map(n => n.from_user));
      if(view !== v || !me) return;
      notifs = rows;
    }
    else if(v === 'quest'){
      const r = await sb.rpc('fil_overview');
      if(r.error) throw r.error;
      if(view !== v || !me) return;
      const sig = JSON.stringify(r.data);
      if(silent && fil && fil.sig === sig && $('#questBox')) return;       // 変化がなければ描き直さない
      fil = Object.assign({ sig }, r.data);
      syncEquipped();
    }
    else if(v === 'dm'){
      if(dw){
        const rows = await q(sb.from('dms').select('id,from_user,to_user,text,image_path,created_at,read_at,reply_to')
          .or(`and(from_user.eq.${me.id},to_user.eq.${dw}),and(from_user.eq.${dw},to_user.eq.${me.id})`)
          .order('created_at', { ascending:false }).limit(200));
        await ensureProfiles([dw]);
        await trySign(rows.map(d => d.image_path));
        if(view !== v || dmWith !== dw || !me) return;
        const msgs = rows.reverse().map(d => ({ id:d.id, mine:d.from_user === me.id, text:d.text, image:d.image_path || null, ts:Date.parse(d.created_at), read:!!d.read_at, reply:d.reply_to || null }));
        const sig = msgs.map(m => m.id + (m.read ? 'r' : '')).join();
        const same = chat && chat.user.id === dw && chat.sig === sig;
        const near = window.innerHeight + window.scrollY >= document.body.scrollHeight - 150;
        const gotNew = chat && chat.user.id === dw && msgs.length > chat.messages.length && !msgs[msgs.length-1].mine;
        chat = { user: U(dw), messages: msgs, sig };
        if(gotNew) typingUntil = 0;
        markRead(dw);
        if(silent && chatShown === dw && $('#chatBody')){
          if(!same){ $('#chatBody').innerHTML = bubbles(); updateTyping(); if(near) window.scrollTo(0, document.body.scrollHeight); }
          return;
        }
      } else {
        const rows = await q(sb.from('dms').select('id,from_user,to_user,text,image_path,created_at').order('created_at', { ascending:false }).limit(300));
        const last = {};
        rows.forEach(d => { const o = d.from_user === me.id ? d.to_user : d.from_user; if(!last[o]) last[o] = d; });
        await ensureProfiles(Object.keys(last));
        if(view !== v || dmWith || !me) return;
        convs = Object.entries(last).map(([id,d]) => ({ user:U(id), text:d.text || '画像を送りました', ts:Date.parse(d.created_at) }));
      }
    }
  }catch(e){ if(!silent) toast(fail(e)); return; }
  render();
  if(v === 'dm' && dmWith){                       // 開いているチャットの相手からの通知は、読んだことにする
    sb.from('notifications').update({ read:true }).eq('read', false).eq('type', 'dm').eq('from_user', dmWith).then(() => pollSummary());
  }
  if(v === 'notif'){
    sb.from('notifications').update({ read:true }).eq('read', false).then(() => { unread = 0; unreadDM = 0; setBadge(); });
  }
}

function setBadge(){
  const bd = $('#nBadge'); bd.textContent = unread; bd.classList.toggle('hidden', !unread || view === 'notif');
  const dd = $('#dBadge'); if(dd){ dd.textContent = unreadDM; dd.classList.toggle('hidden', !unreadDM || view === 'dm'); }
  document.title = (unread ? '(' + unread + ') ' : '') + 'filx';
}

function render(){
  if(!me) return;
  castStash();
  syncFab();
  document.querySelectorAll('.nav-item').forEach(b => b.classList.toggle('on', b.dataset.view === view && (view !== 'me' || !profileId || profileId === me.id)));
  setBadge();
  syncTyping();
  const m = $('#main');
  if(view !== 'dm' || !dmWith) chatShown = null;
  if(view === 'home'){
    const old = $('#t-main'), keep = old ? old.value : '';        // 書きかけの文章は消さない
    const none = homeTab === 'following' && myFollowing.size === 0;
    m.innerHTML = homeTop() + composeHTML('main') +
      (livePost && castSt && castSt.live && castSt.post_id === livePost.id ? liveCardHTML(livePost) : '') +
      (none ? '<div class="empty">まだ誰もフォローしていません<br>投稿のアイコンからプロフィールを開いて、フォローしてみよう</div>' : feedHTML(feed.filter(p => !(livePost && castSt && castSt.live && p.id === livePost.id)), feedMore));
    bindCompose('main');
    if(keep){ $('#t-main').value = keep; $('#n-main').textContent = keep.length + '/400'; }
  }
  else if(view === 'notif') m.innerHTML = headHTML('通知') + notifHTML();
  else if(view === 'dm') dmWith ? renderChat(m) : renderConvs(m);
  else if(view === 'quest') renderQuest(m);
  else if(view === 'search') renderSearch(m);
  else if(view === 'me') renderProfile(m);
  if(pendingScroll && view === 'home'){
    const e = $('#p-' + pendingScroll);
    if(e) e.scrollIntoView({ block:'center' }); else toast('この投稿は見つかりませんでした');
    pendingScroll = null;
  }
  observePosts(); observeMore(); paintOnline(); pfxCheck(); castAttach(); castBar();
  if(isAdmin && view === 'me' && profile && !profile.own) loadAdmFil(profile.user.id);
}

function composeHTML(id){
  const u = PROF[me.id] || me;
  return `<div class="compose" id="cmp-${id}">
    <div class="avatar" style="${avBG(u)}">${avTxt(u)}</div>
    <div class="compose-main">
    <textarea id="t-${id}" maxlength="400" placeholder="いま、どうしてる？"></textarea>
    <div class="pv hidden" id="pv-${id}"></div>
    <div class="compose-row">
      <label class="small-btn">画像<input type="file" accept="image/*" hidden id="f-${id}"></label>
      <button class="small-btn" type="button" onclick="openCastStart()">📡 ライブ</button>
      <span class="count" id="n-${id}">0/400</span>
      <button class="btn send" id="s-${id}">ポスト</button>
    </div></div></div>`;
}
function bindCompose(id, after){
  const t = $('#t-'+id); if(!t) return;
  t.oninput = () => $('#n-'+id).textContent = t.value.length + '/400';
  bindFile(id);
  $('#s-'+id).onclick = async () => {
    const text = t.value.trim(), list = (cimg[id] || []).slice();
    if(!text && !list.length) return toast('文章か画像を入れてください');
    const btn = $('#s-'+id); btn.disabled = true;
    const paths = [];
    try{
      for(const c of list) paths.push(await uploadImg(c.blob));
      await q(sb.from('posts').insert({ user_id: me.id, text, image_paths: paths }));
      dropImg(id);
      if(after) after();
      view = 'home'; dmWith = null; go(); window.scrollTo(0,0); toast('投稿しました');
    }catch(e){ paths.forEach(rmImg); toast(fail(e)); btn.disabled = false; }
  };
}

document.addEventListener('keydown', e => { if(e.key === 'Escape' && $('#modalHost').innerHTML) closeModal(); });

/* ========== フィード ========== */
function feedHTML(list, more){
  if(!list.length) return `<div class="empty">まだ投稿がありません</div>`;
  return list.map(postHTML).join('') + (more ? `<div class="more" id="moreSentinel"><button class="btn ghost" onclick="loadMore()">${loadingMore ? '読み込み中…' : 'もっと見る'}</button></div>` : '<div class="more end">ここまでです</div>');
}
/* 下までスクロールしたら、次の10件を読み込む */
async function loadMore(){
  if(loadingMore || !me) return;
  const v = view, tab = homeTab, pid = profileId;
  const isHome = v === 'home', isProf = v === 'me';
  if(!isHome && !isProf) return;
  const base = isHome ? feed : (profile ? profile.posts : []);
  if(!base.length) return;
  loadingMore = true; const b = $('#moreSentinel button'); if(b) b.textContent = '読み込み中…';
  try{
    const before = base[base.length - 1].cat;
    let qy = sb.from('posts').select(PSEL);
    if(isHome){
      if(tab === 'following') qy = qy.in('user_id', [me.id, ...myFollowing]);
    } else qy = qy.eq('user_id', pid || me.id);
    const rows = await q(qy.lt('created_at', before).order('created_at', { ascending:false }).limit(PAGE));
    const list = rows.map(normPost);
    await ensureProfiles(list.flatMap(p => [p.uid, ...p.comments.map(c => c.uid)]));
    await trySign(list.flatMap(p => p.images));
    if(view !== v || homeTab !== tab || profileId !== pid || !me) return;
    const target = isHome ? feed : profile.posts;
    const have = new Set(target.map(p => p.id));
    list.forEach(p => { if(!have.has(p.id)) target.push(p); });
    if(isHome){ feedLimit = target.length; feedMore = rows.length >= PAGE; }
    else { profLimit = target.length; profMore = rows.length >= PAGE; }
  }catch(e){ toast(fail(e)); }
  finally{ loadingMore = false; }
  render();
}
let moreObs = null;
function observeMore(){
  const el = $('#moreSentinel'); if(!el || !window.IntersectionObserver) return;
  if(!moreObs) moreObs = new IntersectionObserver(es => { if(es.some(e => e.isIntersecting)) loadMore(); }, { rootMargin: '500px' });
  moreObs.disconnect(); moreObs.observe(el);
}
const pinMark = p => (view === 'me' && profile && profile.pinId === p.id) ? '<div class="pinlab">📌 ピン留め</div>' : '';
function postHTML(p){
  const a = U(p.uid), open = openComments.has(p.id), mine = p.uid === me.id;
  const liked = p.likes.includes(me.id);
  return `<div class="post" id="p-${p.id}" data-pid="${p.id}" data-mine="${mine ? 1 : 0}">
    <div class="post-top">
      <div class="avatar link" style="${avBG(a)}" onclick="openProfile('${a.id}')">${avTxt(a)}</div>
      <div class="post-body">
        ${pinMark(p)}
        <div><span class="who link" onclick="openProfile('${a.id}')">${nm(a)}</span><span class="meta">${ago(p.ts)}</span></div>
        ${p.cast ? castLabel(p) : (p.text ? postTextHTML(p.text) : '')}
        ${galleryHTML(p)}
        <div class="actions">
          <button class="act ${liked?'liked':''}" onclick="toggleLike('${p.id}')">${liked?'❤️':'🤍'} ${p.likes.length}</button>
          <button class="act" onclick="toggleComments('${p.id}')">💬 ${p.comments.length}</button>
          ${mine || isAdmin ? `<button class="act" onclick="showViewers('${p.id}')" title="見た人を見る">👁 ${p.views}</button>` : `<span class="act static" title="表示された回数">👁 ${p.views}</span>`}
          ${mine ? `<button class="act" onclick="togglePin('${p.id}')">${me.pinned_post_id === p.id ? '📌 ピン留めを外す' : '📌 ピン留め'}</button><button class="act del" onclick="delPost('${p.id}')">🗑 削除</button>`
                 : (canMod(p.uid) ? `<button class="act del" onclick="delPost('${p.id}')">🗑 削除（${isAdmin ? '管理者' : '金バッジ'}）</button>` : '')}
        </div>
      </div>
    </div>
    ${open ? commentsHTML(p) : ''}
  </div>`;
}
const replyTo = {};                  // 投稿ID → 返信しようとしているコメントID
function commentHTML(p, c, parentName){
  const a = U(c.uid), liked = c.likes.includes(me.id);
  const del = c.uid === me.id ? `<button class="act del" onclick="delComment('${p.id}','${c.id}')">削除</button>`
            : (canMod(c.uid) ? `<button class="act del" onclick="delComment('${p.id}','${c.id}')">削除（${isAdmin ? '管理者' : '金バッジ'}）</button>` : '');
  const to = parentName ? `<div class="replyto">↪ <b>@${esc(parentName)}</b> への返信</div>` : '';
  return `<div class="comment${parentName ? ' reply' : ''}" id="c-${c.id}"><span class="avatar sm link" style="${avBG(a)}" onclick="openProfile('${a.id}')">${avTxt(a)}</span><span class="who link" onclick="openProfile('${a.id}')">${nm(a)}</span><span class="meta">${ago(c.ts)}</span>${to}<div class="text" style="margin:2px 0 0">${esc(c.text)}</div><div class="actions c-act"><button class="act ${liked?'liked':''}" onclick="toggleCommentLike('${p.id}','${c.id}')">${liked?'❤️':'🤍'} ${c.likes.length}</button><button class="act" onclick="startReply('${p.id}','${c.id}')">返信</button>${del}</div></div>`;
}
function commentsHTML(p){
  const byId = {}; p.comments.forEach(c => byId[c.id] = c);
  const kids = {}; const roots = [];
  p.comments.forEach(c => { if(c.parent && byId[c.parent]) (kids[c.parent] = kids[c.parent] || []).push(c); else roots.push(c); });
  const parts = [];
  roots.forEach(r => {
    parts.push(commentHTML(p, r, null));
    const q2 = [...(kids[r.id] || [])], out = [];            // 返信は、元のコメントの下に時間順で並べる
    while(q2.length){ const c = q2.shift(); out.push(c); (kids[c.id] || []).forEach(k => q2.push(k)); }
    out.sort((x, y) => x.ts - y.ts).forEach(c => parts.push(commentHTML(p, c, U(byId[c.parent].uid).name)));
  });
  const rt = replyTo[p.id] && byId[replyTo[p.id]];
  if(replyTo[p.id] && !rt) delete replyTo[p.id];
  const hint = rt ? `<div class="replying">↪ <b>@${esc(U(rt.uid).name)}</b> に返信中 <button onclick="cancelReply('${p.id}')">×</button></div>` : '';
  return `<div class="comments">${parts.join('') || '<div class="meta" style="margin:0">最初のコメントを書いてみよう</div>'}
    ${hint}<div class="cform"><input id="ci-${p.id}" maxlength="100" placeholder="${rt ? '返信を書く' : 'コメントする'}" onkeydown="if(event.key==='Enter')addComment('${p.id}')"><button onclick="addComment('${p.id}')">送信</button></div></div>`;
}

/* ========== インプレッション（画面に半分以上、1秒以上表示された他人の投稿を数える） ========== */
const impSeen = new Set(), impQueue = new Set(), impTimers = {};
let impObs = null;
function observePosts(){
  if(!me || !window.IntersectionObserver) return;
  if(!impObs) impObs = new IntersectionObserver(es => es.forEach(en => {
    const pid = en.target.dataset.pid; if(!pid) return;
    if(en.isIntersecting && en.intersectionRatio >= 0.5){
      if(impSeen.has(pid) || impTimers[pid]) return;
      impTimers[pid] = setTimeout(() => { delete impTimers[pid]; if(!document.hidden && !impSeen.has(pid)){ impSeen.add(pid); impQueue.add(pid); } }, 1000);
    } else if(impTimers[pid]){ clearTimeout(impTimers[pid]); delete impTimers[pid]; }
  }), { threshold: [0, 0.5, 1] });
  impObs.disconnect();
  Object.keys(impTimers).forEach(k => { clearTimeout(impTimers[k]); delete impTimers[k]; });
  document.querySelectorAll('#main .post[data-pid]').forEach(el => { if(el.dataset.mine !== '1' && !impSeen.has(el.dataset.pid)) impObs.observe(el); });
}
async function flushImpressions(){
  if(!me || !impQueue.size) return;
  const ids = [...impQueue].slice(0, 30); ids.forEach(i => impQueue.delete(i));
  try{ const r = await sb.rpc('record_impressions', { ids }); if(r.error) throw r.error; }
  catch(e){ ids.forEach(i => impSeen.delete(i)); }          // 失敗したら、あとでもう一度数える
}
setInterval(flushImpressions, 4000);
document.addEventListener('visibilitychange', () => { if(document.hidden) flushImpressions(); });

/* 入力中の表示（文字そのものは送らず、「いま打っている」という合図だけを相手に届ける） */
let typingCh = null, typingKey = '', typingUntil = 0, typingTimer = null, lastTypingSent = 0;
function syncTyping(){
  const want = (view === 'dm' && dmWith && me) ? [me.id, dmWith].sort().join('_') : '';
  if(want === typingKey) return;
  if(typingCh){ try{ sb.removeChannel(typingCh); }catch(e){} typingCh = null; }
  typingKey = want; typingUntil = 0; lastTypingSent = 0;
  if(!want || !sb.channel) return;
  try{
    const peer = dmWith;
    typingCh = sb.channel('typing:' + want, { config:{ broadcast:{ self:false } } });
    typingCh.on('broadcast', { event:'typing' }, msg => {
      if(msg && msg.payload && msg.payload.from === peer){ typingUntil = Date.now() + 4000; updateTyping(); }
    }).subscribe();
  }catch(e){ typingCh = null; }
}
function updateTyping(){
  const el = $('#typing'); if(!el) return;
  const on = Date.now() < typingUntil;
  el.classList.toggle('hidden', !on);
  el.textContent = on ? (chat ? chat.user.name : '') + 'さんが入力中…' : '';
  clearTimeout(typingTimer);
  if(on) typingTimer = setTimeout(updateTyping, Math.max(200, typingUntil - Date.now() + 50));
}
function sendTyping(){
  const now = Date.now();
  if(!typingCh || now - lastTypingSent < 2000) return;
  const v = $('#dmText'); if(!v || !v.value) return;
  lastTypingSent = now;
  try{ typingCh.send({ type:'broadcast', event:'typing', payload:{ from: me.id } }); }catch(e){}
}

function pickAvatar(inp){
  const f = inp.files[0]; if(!f) return;
  if(!f.type.startsWith('image/')) return toast('画像を選んでください');
  const r = new FileReader();
  r.onload = () => {
    const img = new Image();
    img.onload = () => {
      const S = 96, c = document.createElement('canvas'); c.width = c.height = S;
      const m = Math.min(img.width, img.height);
      const x = c.getContext('2d');
      x.fillStyle = '#fff'; x.fillRect(0, 0, S, S);
      x.drawImage(img, (img.width-m)/2, (img.height-m)/2, m, m, 0, 0, S, S);
      pendingAvatar = c.toDataURL('image/jpeg', 0.75);
      const p = $('#avPrev'); p.style.background = `url('${pendingAvatar}') center/cover`; p.textContent = '';
    };
    img.onerror = () => toast('画像を読み込めませんでした');
    img.src = r.result;
  };
  r.readAsDataURL(f);
}
function removeAvatar(){

/* 管理者だけ：アカウントを削除（その人の投稿・コメント・DM・フォロー・画像もすべて消える） */
async function purgeFolder(uid){
  for(let i = 0; i < 30; i++){
    const r = await sb.storage.from(BUCKET).list(uid, { limit: 100 });
    if(r.error || !r.data || !r.data.length) return;
    const names = r.data.filter(x => x && x.name).map(x => `${uid}/${x.name}`);
    if(!names.length) return;
    const d = await sb.storage.from(BUCKET).remove(names);
    if(d.error) return;
  }
}

/* ========== オンライン表示（いまアプリを開いている人） ========== */
let showOnline = true;
try{ showOnline = localStorage.getItem('filx_online') !== '0'; }catch(e){}
let onCh = null, onlineIds = new Set();
function startPresence(){
  stopPresence();
  if(!me || !sb || !sb.channel) return;
  try{
    onCh = sb.channel('filx-online', { config:{ presence:{ key: me.id } } });
    onCh.on('presence', { event:'sync' }, syncOnline);
    onCh.subscribe(st => { if(st === 'SUBSCRIBED') trackOnline(); });
  }catch(e){ onCh = null; }
}
function stopPresence(){
  if(onCh){ try{ sb.removeChannel(onCh); }catch(e){} onCh = null; }
  onlineIds = new Set();
}
function trackOnline(){
  if(!onCh) return;
  try{
    if(showOnline && !document.hidden) onCh.track({ at: Date.now() });
    else onCh.untrack();
  }catch(e){}
}
function setShowOnline(v){
  showOnline = !!v;
  try{ localStorage.setItem('filx_online', v ? '1' : '0'); }catch(e){}
  trackOnline(); toast(v ? 'オンライン中であることを表示します' : 'オンライン中であることを表示しません');
}
function syncOnline(){
  if(!onCh || !me) return;
  let st = {}; try{ st = onCh.presenceState() || {}; }catch(e){}
  onlineIds = new Set(Object.keys(st));
  ensureProfiles([...onlineIds].filter(id => id !== me.id).slice(0, 60)).catch(() => {}).then(paintOnline);
}
function paintOnline(){
  if(!me) return;
  document.querySelectorAll('.dot[data-uid],.onltag[data-uid]').forEach(el => el.classList.toggle('on', onlineIds.has(el.dataset.uid)));
  const box = $('#onlineBox'); if(!box) return;
  const others = [...onlineIds].filter(id => id !== me.id && PROF[id] && !myBlocks.has(id));
  box.innerHTML = others.length
    ? `<div class="onl-head">オンライン中（${others.length}人）</div><div class="onl-list">${others.map(id => { const u = U(id); return `<button class="onl-chip" onclick="openChat('${esc(id)}')"><span class="avatar sm" style="${avBG(u)}">${avTxt(u)}</span>${nm(u)}</button>`; }).join('')}</div>`
    : `<div class="onl-head">いまオンラインの人はいません</div>`;
}
document.addEventListener('visibilitychange', trackOnline);



/* ========== 管理者: 垢をまとめてBAN ========== */
let banList = [], banSel = new Set(), banTimer = null;

  if(!isAdmin) return;
  banSel = new Set();
  $('#modalHost').innerHTML = `<div class="modal-bg" id="mbg"><div class="modal"><div class="head" style="position:static">アカウント管理（まとめてBAN）</div>

    <div class="ban-foot"><button class="btn inline ghost-danger" id="banGo" onclick="banRun()" disabled>選んだ人をBAN</button><button class="btn inline ghost" onclick="botLog()">自動BANの記録</button><button class="btn inline ghost" onclick="closeModal()">閉じる</button></div></div></div>`;

async function botLog(){
  try{

async function botUnban(id){
  if(!confirm('この自動BANを解除しますか？\nアカウントが残っていればログインできるようになります（消えたポストなどは戻りません）。')) return;
  try{ await q(sb.rpc('admin_bot_unban', { log_id: id })); toast('解除しました'); botLog(); }catch(e){ toast(fail(e)); }
}
function banSearchSoon(){ clearTimeout(banTimer); banTimer = setTimeout(banLoad, 300); }
async function banLoad(){
  try{
    const r = await sb.rpc('admin_list_users', { search: ($('#banQ') || { value:'' }).value });
    if(r.error) throw r.error;
    banList = r.data || [];
    banPaint();
  }catch(e){ toast(fail(e)); }
}
function banPaint(){
  const box = $('#banBox'); if(!box) return;
  const d = x => new Date(x).toLocaleDateString('ja-JP');
  box.innerHTML = banList.length ? banList.map(u => `<label class="conv ban-row"><input type="checkbox" ${banSel.has(u.id) ? 'checked' : ''} onchange="banTick('${u.id}', this.checked)"><div style="min-width:0;flex:1"><b>${nm(u)}</b><div class="small-sub">投稿 ${u.posts}件 ・ ${d(u.created_at)}登録 ・ ${u.fil} fil</div></div><button class="btn inline ghost ban-fil" onclick="event.preventDefault();event.stopPropagation();adminSetFil('${u.id}', ${u.fil})">fil変更</button></label>`).join('')
                              : '<div class="empty">該当する人がいません</div>';
  banCount();
}
function banTick(id, on){ if(on) banSel.add(id); else banSel.delete(id); banCount(); }
function banAll(on){ banList.forEach(u => on ? banSel.add(u.id) : banSel.delete(u.id)); banPaint(); }
function banCount(){ const b = $('#banGo'); if(!b) return; b.disabled = !banSel.size; b.textContent = banSel.size ? `選んだ ${banSel.size} 人をBAN` : '選んだ人をBAN'; }
async function banRun(){
  const ids = [...banSel]; if(!ids.length) return;
  if(ids.length > 100){ toast('一度に消せるのは100人までです'); return; }
  const names = banList.filter(u => banSel.has(u.id)).slice(0, 5).map(u => u.name).join('、');
  if(!confirm(`${ids.length}人（${names}${ids.length > 5 ? ' ほか' : ''}）のアカウントを削除してBANします。\n投稿・コメント・DM・画像など、すべてのデータが消えます。メールアドレスも登録できなくなります。\nこの操作は元に戻せません。本当によろしいですか？`)) return;
  const btn = $('#banGo'); if(btn) btn.disabled = true;
  try{
    for(const id of ids){ try{ await purgeFolder(id); }catch(e){} }
    const n = await q(sb.rpc('admin_delete_users', { targets: ids }));
    ids.forEach(id => { delete PROF[id]; myFollowing.delete(id); });
    banSel = new Set(); toast(`${n}人をBANしました`);
    feed = []; feedCtx = ''; profile = null; await banLoad(); refresh(true);
  }catch(e){ toast(fail(e)); banCount(); }
}


/* ========== 管理者: 人のfilを変える ========== */
async function adminSetFil(id, cur){
  if(!isAdmin) return;
  const name = (banList.find(u => u.id === id) || PROF[id] || {}).name || 'この人';
  const v = prompt(`「${name}」のfilを何fil にしますか？（いまは ${cur} fil）\n0 〜 100000000 の数字を入れてください`, String(cur));
  if(v === null) return;
  const n = Number(String(v).trim());
  if(!/^\d+$/.test(String(v).trim()) || !Number.isSafeInteger(n) || n > 100000000){ toast('0 〜 100000000 の数字を入れてください'); return; }
  try{
    await q(sb.rpc('admin_set_fil', { target: id, amount: n }));
    toast(`「${name}」のfilを ${n} にしました`);
    if($('#banBox')) await banLoad();
    if(view === 'me' && profile && profile.user.id === id) loadAdmFil(id);
  }catch(e){ toast(fail(e)); }
}
async function adminSetVerified(id, on){
  if(!isAdmin) return;
  try{
    await q(sb.rpc('admin_set_verified', { target: id, on_: on }));
    if(PROF[id]){ PROF[id].verified = on; if(!on) PROF[id].gold = false; }

}
/* ----- 凍結（1時間）。管理者と金バッジの人ができる ----- */

/* ========== フィルキャスト（ライブ配信。ホームの「ポスト」として出る。1人だけ・1回5分まで） ========== */
/* 映像と音声は、配信する人と見る人が直接つながる（WebRTC）。サーバーは「いま誰が配信中か」と時間の管理だけ */
const CAST_MAX_VIEWERS = 8, CAST_MIN = 5;
const ICE = { iceServers: [{ urls: 'stun:stun.l.google.com:19302' }, { urls: 'stun:stun1.l.google.com:19302' }] };
let castSt = null, castOff = 0, castSig = '', livePost = null;
const cast = { role:'none', mode:'', hostId:'', hostName:'', endMs:0, startedAt:0, ch:null, chReady:false, chWait:[], pcs:{}, ice:{}, stream:null, ping:null, join:null, viewers:new Set(), q:[], qt:null, connected:false, note:'' };
const castEls = () => {
  let box = $('#castMedia');
  if(!box){ box = document.createElement('div'); box.id = 'castMedia'; box.style.cssText = 'position:fixed;left:-9999px;top:0;width:2px;height:2px;overflow:hidden';
    box.innerHTML = '<video id="castVideo" autoplay playsinline controls class="cast-video"></video>'; document.body.appendChild(box); }
  return box;
};
const castStash = () => { const v = $('#castVideo'); if(v && !v.closest('#castMedia')) castEls().appendChild(v); };   // 画面を描き直す前に、動画を避難させる（再生を止めない）
const mmss = ms => { const s = Math.max(0, Math.ceil(ms / 1000)); return Math.floor(s / 60) + ':' + String(s % 60).padStart(2, '0'); };
const castLeft = () => cast.endMs - Date.now();
const isLivePost = p => !!(p && p.cast && castSt && castSt.live && castSt.post_id === p.id);

async function castPoll(quiet){
  if(!me || !sb) return;
  try{
    const r = await sb.rpc('cast_get'); if(r.error || !r.data) return;
    const d = r.data, prev = castSt, before = castSigOf();
    castOff = Date.parse(d.now) - Date.now(); castSt = d;
    if(prev && !prev.live && d.live && d.host !== me.id && cast.role === 'none') toast(`${d.host_name || '誰か'} さんがライブ配信を始めました（ホームの一番上）`);
    if(cast.role === 'viewer' && (!d.live || d.host !== cast.hostId)) castLeave('配信が終わりました');
    if(cast.role === 'host' && Date.now() - cast.startedAt > 6000 && (!d.live || d.host !== me.id)) castEnd('配信が終わりました');
    if(d.live && d.ends_at && (cast.role === 'host' || cast.role === 'viewer')) cast.endMs = Date.parse(d.ends_at) - castOff;   // 終了時刻はサーバーが決める
    if(d.live && !cast.ch) castEnsureCh(); else if(!d.live) castCloseIfIdle();
    if(!quiet && view === 'home' && before !== castSigOf() && !isBusy()) refresh(true);
  }catch(e){}
}
const castSigOf = () => [cast.role, castSt && castSt.live, castSt && castSt.post_id, castSt && castSt.mode].join('|');

/* ----- 合図（シグナリング）とチャットの更新通知。Realtimeのbroadcastを使う ----- */
function castEnsureCh(){
  return new Promise(res => {
    if(!sb || !sb.channel){ res(false); return; }
    if(cast.ch){ if(cast.chReady) res(true); else cast.chWait.push(res); return; }
    try{
      cast.chReady = false; cast.chWait = [res];
      cast.ch = sb.channel('filx-cast', { config:{ broadcast:{ self:false } } });
      cast.ch.on('broadcast', { event:'sig' }, m => { try{ castOnSig(m.payload || {}); }catch(e){} });
      cast.ch.subscribe(st => { if(st === 'SUBSCRIBED'){ cast.chReady = true; const w = cast.chWait; cast.chWait = []; w.forEach(f => f(true)); } });
      cast.qt = setInterval(() => { const p = cast.q.shift(); if(p && cast.ch && cast.chReady){ try{ cast.ch.send({ type:'broadcast', event:'sig', payload:p }); }catch(e){} } }, 70);
    }catch(e){ cast.ch = null; res(false); }
  });
}
function castClose(){
  clearInterval(cast.qt); cast.qt = null; cast.q = []; cast.chReady = false; cast.chWait = [];
  if(cast.ch){ try{ sb.removeChannel(cast.ch); }catch(e){} cast.ch = null; }
}
function castCloseIfIdle(){ if(cast.role === 'none' && !(castSt && castSt.live)) castClose(); }
const castSend = p => { cast.q.push(Object.assign({ from: me.id }, p)); };
function castOnSig(p){
  if(!me || !p || p.from === me.id) return;
  if(p.type === 'chat'){ castChatLoad(); return; }
  if(p.to && p.to !== me.id) return;
  if(cast.role === 'host'){
    if(p.type === 'join') hostAdd(String(p.from));
    else if(p.type === 'answer') hostAnswer(String(p.from), p.sdp);
    else if(p.type === 'ice') addIce(String(p.from), p.cand);
    else if(p.type === 'leave') hostDrop(String(p.from));
  } else if(cast.role === 'viewer' && p.from === cast.hostId){
    if(p.type === 'offer') viewerOffer(p.sdp);
    else if(p.type === 'ice') addIce('host', p.cand);
    else if(p.type === 'full') castLeave('いまは満員です（最大' + CAST_MAX_VIEWERS + '人）');
    else if(p.type === 'end') castLeave('配信が終わりました');
  }
}
async function addIce(key, cand){
  const pc = cast.pcs[key];
  if(!pc || !cand) return;
  if(!pc.remoteDescription){ (cast.ice[key] = cast.ice[key] || []).push(cand); return; }
  try{ await pc.addIceCandidate(cand); }catch(e){}
}
async function flushIce(key, pc){
  const l = cast.ice[key] || []; cast.ice[key] = [];
  for(const c of l){ try{ await pc.addIceCandidate(c); }catch(e){} }
}

/* ----- 配信する側 ----- */
async function castCapture(mode, withMic){
  const md = navigator.mediaDevices;
  if(!md) throw new Error('このブラウザでは使えません');
  if(mode === 'audio'){
    return await md.getUserMedia({ audio:{ echoCancellation:true, noiseSuppression:true }, video:false });
  }
  if(!md.getDisplayMedia) throw new Error('この端末では画面共有はできません（PCのブラウザで使えます）');
  const disp = await md.getDisplayMedia({ video:{ frameRate:{ ideal:15, max:20 }, width:{ max:1920 } }, audio:true });
  if(!withMic) return disp;
  let mic = null; try{ mic = await md.getUserMedia({ audio:{ echoCancellation:true, noiseSuppression:true } }); }catch(e){}
  if(!mic) return disp;
  const AC = window.AudioContext || window.webkitAudioContext;
  const ac = new AC(), dest = ac.createMediaStreamDestination();
  [disp, mic].forEach(s => { if(s.getAudioTracks().length) ac.createMediaStreamSource(new MediaStream(s.getAudioTracks())).connect(dest); });
  const out = new MediaStream([...disp.getVideoTracks(), ...dest.stream.getAudioTracks()]);
  out.__extra = { ac, srcs:[disp, mic] };
  return out;
}
function openCastStart(){
  const busy = castSt && castSt.live, wait = castSt && castSt.wait > 0 && !busy;
  const canScreen = !!(navigator.mediaDevices && navigator.mediaDevices.getDisplayMedia);
  const modal = $('#modalHost'); if(modal.innerHTML) closeModal();
  $('#modalHost').innerHTML = `<div class="modal-bg" id="mbg"><div class="modal"><div class="head" style="position:static">📡 ライブ配信（フィルキャスト）</div>
    <div class="cast-start">
      ${busy ? `<p class="cast-help" style="color:var(--text)">いま ${esc(castSt.host_name || '誰か')} さんが配信中です。終わるまで待ってね。</p>` : ''}
      ${wait ? `<p class="cast-help" style="color:var(--text)">つづけて配信はできません。あと ${Math.ceil(castSt.wait / 60)} 分待ってね。</p>` : ''}

      <p class="cast-help">・配信はホームの一番上に「ポスト」として出ます。見ている人は、リアルタイムでコメントできます<br>・同時に配信できるのは、filx全体で1人だけ<br>・1回の配信は最大${CAST_MIN}分。時間がきたら自動で終わります<br>・終わったあと、同じ人は5分待つと、また始められます<br>・学校のネットワークによっては、つながらないことがあります</p>
      <div class="cast-btns"><button class="btn inline ghost" onclick="closeModal()">閉じる</button></div>
    </div></div></div>`;
  $('#mbg').onclick = e => { if(e.target.id === 'mbg') closeModal(); };

async function castBegin(mode){
  if(cast.role !== 'none'){ toast('いま配信中か、視聴中です'); return; }
  if(!sb || !sb.channel){ toast('この環境では使えません'); return; }
  const withMic = !!($('#castMic') && $('#castMic').checked);
  let stream;
  try{ stream = await castCapture(mode, withMic); }
  catch(e){ toast(e && e.name === 'NotAllowedError' ? '許可されなかったので始められません' : (e && e.message) || '始められませんでした'); return; }
  let st;
  try{
    const r = await sb.rpc('cast_start', { m: mode }); if(r.error) throw r.error; st = r.data;
  }catch(e){ castStopTracks(stream); toast(fail(e)); castPoll(); return; }
  castSt = st; castOff = Date.parse(st.now) - Date.now();
  Object.assign(cast, { role:'host', mode, hostId:me.id, hostName:me.name, stream, endMs: Date.parse(st.ends_at) - castOff, startedAt: Date.now(), connected:true, note:'' });
  cast.viewers = new Set(); cast.pcs = {}; cast.ice = {}; chatSig = '';
  stream.getTracks().forEach(t => { t.onended = () => { if(cast.role === 'host' && cast.stream === stream) castEnd('共有を止めました'); }; });
  cast.ping = setInterval(async () => {
    try{ const r = await sb.rpc('cast_ping'); if(r.error) throw r.error; }catch(e){ if(cast.role === 'host') castEnd('配信が終わりました'); }
  }, 15000);
  castEnsureCh();
  toast(`配信を始めました（最大${CAST_MIN}分）`);
  view = 'home'; dmWith = null; feedCtx = ''; go(); window.scrollTo(0, 0);
}
function castStopTracks(stream){
  if(!stream) return;
  stream.getTracks().forEach(t => { try{ t.onended = null; t.stop(); }catch(e){} });
  if(stream.__extra){ stream.__extra.srcs.forEach(s => s.getTracks().forEach(t => { try{ t.stop(); }catch(e){} })); try{ stream.__extra.ac.close(); }catch(e){} }
}
function mkPC(key, onGone){
  const pc = new RTCPeerConnection(ICE);
  pc.onicecandidate = e => { if(e.candidate) castSend({ type:'ice', to: key === 'host' ? cast.hostId : key, cand: e.candidate.toJSON() }); };
  pc.onconnectionstatechange = () => {
    if(pc.connectionState === 'failed' || pc.connectionState === 'closed') onGone('failed');
    else if(pc.connectionState === 'disconnected'){ setTimeout(() => { if(pc.connectionState === 'disconnected') onGone('lost'); }, 6000); }
  };
  return pc;
}
async function hostAdd(vid){
  if(!cast.stream || !vid) return;
  if(cast.pcs[vid]){ try{ cast.pcs[vid].close(); }catch(e){} delete cast.pcs[vid]; }
  if(Object.keys(cast.pcs).length >= CAST_MAX_VIEWERS){ castSend({ type:'full', to: vid }); return; }
  const pc = mkPC(vid, () => hostDrop(vid));
  cast.pcs[vid] = pc; cast.ice[vid] = [];
  cast.stream.getTracks().forEach(t => pc.addTrack(t, cast.stream));
  try{
    const off = await pc.createOffer(); await pc.setLocalDescription(off);
    castSend({ type:'offer', to: vid, sdp: { type: off.type, sdp: off.sdp } });
    pc.getSenders().forEach(sn => { if(sn.track && sn.track.kind === 'video'){ try{ const pr = sn.getParameters(); pr.encodings = pr.encodings && pr.encodings.length ? pr.encodings : [{}]; pr.encodings[0].maxBitrate = 1500000; sn.setParameters(pr).catch(() => {}); }catch(e){} } });
  }catch(e){ hostDrop(vid); return; }
  cast.viewers.add(vid); castViewerCount();
}
async function hostAnswer(vid, sdp){
  const pc = cast.pcs[vid]; if(!pc || !sdp) return;
  try{ await pc.setRemoteDescription(sdp); await flushIce(vid, pc); }catch(e){ hostDrop(vid); }
}
function hostDrop(vid){
  const pc = cast.pcs[vid]; if(pc){ try{ pc.close(); }catch(e){} delete cast.pcs[vid]; }
  delete cast.ice[vid]; cast.viewers.delete(vid); castViewerCount();
}
function castViewerCount(){

}

function castWatch(){

  Object.assign(cast, { role:'viewer', mode:st.mode, hostId:st.host, hostName:st.host_name || '', endMs: Date.parse(st.ends_at) - castOff, connected:false, note:'つなぎ中…' });
  cast.pcs = {}; cast.ice = {};
  castEls(); const v = $('#castVideo'); if(v){ v.muted = false; }
  let tries = 0;
  castEnsureCh().then(okCh => {
    if(!okCh){ cast.note = 'つなぐ準備に失敗しました'; castRefreshNote(); return; }
    const tryJoin = () => {
      if(cast.role !== 'viewer' || cast.connected) return;
      if(++tries > 6){ cast.note = 'つながりませんでした。学校のネットワークでは使えないことがあります'; castRefreshNote(); return; }
      castSend({ type:'join', to: cast.hostId }); cast.join = setTimeout(tryJoin, 3500);
    };

  });

}
async function viewerOffer(sdp){
  if(cast.role !== 'viewer' || !sdp) return;
  clearTimeout(cast.join);
  if(cast.pcs.host){ try{ cast.pcs.host.close(); }catch(e){} }
  const pc = mkPC('host', why => { if(cast.role === 'viewer') castLeave(why === 'lost' ? '配信とのつながりが切れました' : 'つながりませんでした'); });
  cast.pcs.host = pc; cast.ice.host = [];
  pc.ontrack = e => {
    const v = $('#castVideo'); if(!v) return;
    if(v.srcObject !== e.streams[0]) v.srcObject = e.streams[0];
    cast.connected = true; cast.note = '';
    v.play().catch(() => { cast.note = '▶ を押すと音が出ます'; castRefreshNote(); });
    castRefreshNote();
  };
  try{
    await pc.setRemoteDescription(sdp); await flushIce('host', pc);
    const ans = await pc.createAnswer(); await pc.setLocalDescription(ans);
    castSend({ type:'answer', to: cast.hostId, sdp: { type: ans.type, sdp: ans.sdp } });
  }catch(e){ castLeave('つながりませんでした'); }
}
function castLeave(msg){

/* ========== クエスト・fil・アイコンの飾り ========== */
let fil = null, questTab = 'quest', shopKind = 'frame';
const KINDS = [['frame','フレーム'], ['hat','あたまの飾り'], ['badge','バッジ'], ['effect','エフェクト'], ['pfx','プロフィール演出'], ['theme','着せ替え'], ['locker','ロッカー小物'], ['lkbg','ロッカーの壁']];
const DEFK = { theme:'th_dark', lkbg:'lkbg_gray' };   // これらは「外す」ではなく標準に戻す種類
const stars = r => '★'.repeat(r >= 150 ? 5 : r >= 40 ? 4 : r >= 12 ? 3 : r >= 5 ? 2 : 1);
function syncEquipped(){
  const e = (fil && fil.equipped) || {};

function setQuestTab(t){ questTab = t; render(); window.scrollTo(0, 0); }

/* 受け取れるものを一番上、受け取り済みを一番下に */
const qRank = q => q.claimed ? 2 : (q.progress >= q.target ? 0 : 1);
const qSort = list => list.map((q, i) => [q, i]).sort((a, b) => qRank(a[0]) - qRank(b[0]) || a[1] - b[1]).map(x => x[0]);
function questCard(q){
  const done = q.progress >= q.target, pct = Math.round(q.progress / q.target * 100);
  const btn = q.claimed ? '<span class="q-done">✓ 受け取り済み</span>'
            : done ? `<button class="btn inline q-claim" onclick="claimQuest('${q.id}')">受け取る</button>`
            : `<span class="q-prog">${q.progress} / ${q.target}</span>`;
  return `<div class="quest${q.claimed ? ' claimed' : ''}${done && !q.claimed ? ' ready' : ''}">
    <div class="q-main"><div class="q-title">${esc(q.title)}<span class="q-star">${stars(q.reward)}</span></div>
      <div class="q-desc">${esc(q.descr)}</div>
      <div class="q-bar"><i style="width:${pct}%"></i></div></div>
    <div class="q-side"><div class="q-reward">+${q.reward}<small> fil</small></div>${btn}</div></div>`;
}
function itemCard(f){
  const isT = f.kind in DEFK, isL = f.kind === 'locker';
  const eqv = (fil.equipped || {})[f.kind];
  const mineOn = isT ? (eqv || DEFK[f.kind]) === f.id : eqv === f.id, can = fil.infinite || fil.balance >= f.price;
  const prev = { id: me.id, name: me.name, avatar: me.avatar, [f.kind]: f.id };
  const buy = `<button class="btn inline${can ? '' : ' ghost'}" onclick="buyItem('${f.id}')">${f.price} fil で買う</button>`;

    : isT ? (mineOn ? '' : f.owned ? `<button class="btn inline" onclick="equipItem('${f.kind}', ${f.id === DEFK[f.kind] ? 'null' : `'${f.id}'`})">${f.kind === 'theme' ? '着せ替える' : 'つける'}</button>` : buy)
    : f.owned ? (mineOn ? `<button class="btn inline ghost" onclick="equipItem('${f.kind}', null)">外す</button>` : `<button class="btn inline" onclick="equipItem('${f.kind}', '${f.id}')">つける</button>`)
    : buy;

  const price = f.owned ? (mineOn ? '装備中' : (f.price === 0 ? '無料' : isL ? '持っています（ロッカーに置こう）' : '持っています')) : f.price + ' fil';

function renderQuest(m){

  const tabs = `<div class="subtabs"><button class="${questTab==='quest'?'on':''}" onclick="setQuestTab('quest')">クエスト${ready ? `<span class="badge" style="margin-left:6px">${ready}</span>` : ''}</button><button class="${questTab==='shop'?'on':''}" onclick="setQuestTab('shop')">ショップ</button></div>`;
  const bal = `<div class="fil-bal"><span class="fil-coin">fil</span><b>${fil.infinite ? '∞' : fil.balance}</b><small>fil</small>${fil.infinite ? '<span class="fil-adm">管理者</span>' : ''}</div>`;
  let body;
  if(questTab === 'shop'){

    const wLeft = (() => { const dow = (jst.getUTCDay() + 6) % 7; const mins = (6 - dow) * 1440 + (23 - jst.getUTCHours()) * 60 + (60 - jst.getUTCMinutes()); const d = Math.floor(mins / 1440), h = Math.floor(mins % 1440 / 60); return d ? `あと${d}日${h}時間` : `あと${h}時間`; })();
    body = `<div class="q-sec">毎時 <small>毎時0分にリセット（あと${mm}分）</small></div>${hourly.map(questCard).join('')}
            <div class="q-sec">デイリー <small>毎日0時にリセット</small></div>${daily.map(questCard).join('')}
            <div class="q-sec">ウィークリー <small>毎週月曜0時にリセット（${wLeft}）</small></div>${weekly.map(questCard).join('')}
            <div class="q-sec">チャレンジ <small>1回だけ・ごほうび大きめ</small></div>${once.map(questCard).join('')}`;
  }
  m.innerHTML = headHTML('クエスト') + bal + tabs + `<div id="questBox">${body}</div>`;
}

/* ========== 自動更新（新しい通知・投稿・DMを数秒ごとに取り込む） ========== */
async function pollSummary(){
  if(!me) return;
  try{
    const [r, r2] = await Promise.all([
      sb.from('notifications').select('id', { count:'exact', head:true }).eq('read', false),
      sb.from('notifications').select('id', { count:'exact', head:true }).eq('read', false).eq('type', 'dm')
    ]);
    if(r.error) throw r.error;
    const n = r.count || 0, d = r2.error ? 0 : (r2.count || 0);
    if(!document.hidden){
      if(d > unreadDM && !(view === 'dm' && dmWith)) toast('新しいメッセージが届きました');
      else if(n > unread && view !== 'notif' && !(view === 'dm' && dmWith)) toast('新しい通知があります');
    }
    unread = n; unreadDM = d; setBadge();
  }catch(e){}
}
const isBusy = () => {
  if(editing || $('#modalHost').innerHTML || Object.keys(cimg).some(k => (cimg[k] || []).length)) return true;
  const ae = document.activeElement;
  if(ae && (ae.tagName === 'INPUT' || ae.tagName === 'TEXTAREA')) return true;
  return [...document.querySelectorAll('#main input[type=text],#main input:not([type]),#main textarea')].some(x => x.value);
};
let hiddenTick = 0;
setInterval(() => {
  if(!me) return;
  if(document.hidden){ if(++hiddenTick % 3 === 0) pollSummary(); return; }   // 別タブにいる間は15秒ごとに件数だけ確認（タブの題名に出る）
  pollSummary();
  if(view === 'dm' && dmWith) refresh(true);     // チャットは入力中でも新着だけ差し込む
  else if(!isBusy()) refresh(true);
}, 5000);
document.addEventListener('visibilitychange', () => { if(!document.hidden && me){ pollSummary(); if(!isBusy()) refresh(true); } });

/* ========== 起動 ========== */
let sbProblem = '';
(async () => {
  setMode('login');
  if(!window.supabase){ sbProblem = '部品を読み込めませんでした。ネットにつながっているか確認してください'; $('#aErr').textContent = sbProblem; return; }
  if(SUPABASE_URL.startsWith('__') || SUPABASE_KEY.startsWith('__')){ sbProblem = '設定がまだ終わっていません（index.html の SUPABASE_URL と SUPABASE_KEY を入れてください）'; $('#aErr').textContent = sbProblem; return; }
  try{ sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY); }
  catch(e){ sbProblem = '設定が正しくありません: ' + e.message; $('#aErr').textContent = sbProblem; return; }
  sb.auth.onAuthStateChange(ev => { if(ev === 'SIGNED_OUT' && me) doLogout(true); });
  try{
    const { data } = await sb.auth.getSession();
    if(!data.session) return;
    $('#auth').classList.add('hidden');
    await loadMe(); start();
  }catch(e){
    $('#auth').classList.remove('hidden');
    if(/Failed to fetch|NetworkError|Load failed/i.test(e.message || '')) $('#aErr').textContent = 'ネットにつながりません';
  }
})();

/* Ctrl を素早く2回押すと、このタブを Google に切り替える。管理者が5回押すと、全員を別のサイトへ移動させる */
let ctrlN = 0, ctrlT = null, ctrlLast = 0;
const goGoogle = () => location.replace('https://www.google.com/');   // filxのタブをそのままGoogleに置き換える（履歴にも残さない）
window.addEventListener('keydown', e => {
  if((e.key !== 'Control' && e.code !== 'ControlLeft' && e.code !== 'ControlRight') || e.repeat) return;
  const now = Date.now();
  ctrlN = (now - ctrlLast < 800) ? ctrlN + 1 : 1; ctrlLast = now;
  clearTimeout(ctrlT);
  if(me && isAdmin){
    if(ctrlN >= 5){ ctrlN = 0; adminRedirectAll(); return; }
    ctrlT = setTimeout(() => { if(ctrlN === 2) goGoogle(); ctrlN = 0; }, 850);   // 5回押しと区別するため、管理者は少し待つ
  } else if(ctrlN === 2){ ctrlN = 0; goGoogle(); }
}, true);
