<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>filx</title>
<style>
:root{color-scheme:dark;--bg:#0b0d12;--card:#14171f;--text:#e8eaf0;--sub:#8a90a2;--line:#262b38;--main:#8b7cf6;--main2:#a29bfe;--red:#f0587c}
*{box-sizing:border-box}
body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Noto Sans JP",sans-serif;background:var(--bg);color:var(--text)}
button{font:inherit;cursor:pointer}
input,textarea,select{font:inherit;color:inherit;background:var(--bg)}
.hidden{display:none!important}

/* auth */
#auth{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px;background:var(--bg)}
.auth-box{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:32px;width:100%;max-width:380px}
.logo{font-size:28px;font-weight:800;color:var(--main);margin:0 0 4px}
.tag{color:var(--sub);font-size:13px;margin:0 0 20px}
.tabs{display:flex;gap:8px;margin-bottom:16px}
.tabs button{flex:1;padding:10px;border:none;border-radius:10px;background:var(--bg);color:var(--sub);font-weight:700}
.tabs button.on{background:var(--main);color:#0b0d12}
.field{margin-bottom:12px}
.field label{display:block;font-size:12px;color:var(--sub);margin-bottom:4px}
.field input,.field textarea{width:100%;padding:11px 12px;border:1px solid var(--line);border-radius:10px;outline:none;resize:none}
.field input:focus,.field textarea:focus{border-color:var(--main)}
.btn{width:100%;padding:12px;border:none;border-radius:12px;background:var(--main);color:#0b0d12;font-weight:700}
.btn:hover{opacity:.9}
.err{color:var(--red);font-size:13px;min-height:18px;margin:6px 0}
.note{font-size:12px;color:var(--sub);margin-top:12px;line-height:1.6}

/* app layout */
#app{display:flex;min-height:100vh;max-width:1000px;margin:0 auto}
nav{width:230px;padding:20px 12px;position:sticky;top:0;height:100vh;display:flex;flex-direction:column;gap:4px;border-right:1px solid var(--line);background:var(--card)}
nav .logo{padding:0 12px 16px}
.nav-item{display:flex;align-items:center;gap:12px;padding:12px 14px;border:none;background:none;border-radius:12px;font-size:16px;text-align:left;font-weight:600;color:var(--text);position:relative}
.nav-item:hover{background:var(--bg)}
.nav-item.on{background:rgba(139,124,246,.16);color:var(--main)}
.nav-item .ic{font-size:20px;width:24px;text-align:center}
.badge{background:var(--red);color:#fff;border-radius:10px;font-size:11px;padding:1px 7px;margin-left:auto}
.nav-post{margin-top:12px}
main{flex:1;min-width:0;max-width:640px;border-right:1px solid var(--line);background:var(--card);min-height:100vh}
.head{position:sticky;top:0;z-index:5;background:rgba(20,23,31,.9);backdrop-filter:blur(8px);padding:16px 20px;font-weight:800;font-size:18px;border-bottom:1px solid var(--line)}
aside{flex:1;padding:20px;min-width:0}
.side-card{background:var(--card);border-radius:16px;padding:16px;font-size:13px;color:var(--sub);line-height:1.7}
.side-card b{color:var(--text)}

/* compose */
.compose{padding:16px 20px;border-bottom:8px solid var(--bg)}
.compose textarea{background:transparent;width:100%;border:none;outline:none;resize:none;font-size:16px;min-height:70px}
.compose-row{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-top:8px}
.switch{display:flex;align-items:center;gap:6px;font-size:13px;color:var(--sub)}
.compose .send{margin-left:auto;width:auto;padding:8px 22px;border-radius:20px}
.count{font-size:12px;color:var(--sub)}

/* post */
.post{padding:16px 20px;border-bottom:1px solid var(--line)}
.post-top{display:flex;gap:12px}
.avatar.link,.who.link{cursor:pointer}
.who.link:hover{text-decoration:underline}
.avatar.sm{width:22px;height:22px;font-size:11px;display:inline-flex;margin-right:6px;vertical-align:middle}
.bio{white-space:pre-wrap;word-break:break-word;line-height:1.6;margin:8px auto 4px!important;max-width:420px;color:var(--text)!important}
.edit{text-align:left;max-width:420px;margin:0 auto}
.edit .avatar{margin:0 auto 10px!important}
.edit-btns{display:flex;gap:8px;justify-content:center;margin-bottom:16px}
.small-btn{padding:7px 16px;border:1px solid var(--line);background:var(--card);color:var(--text);border-radius:20px;font-size:13px;font-weight:700;cursor:pointer}
.btn-row{display:flex;gap:8px;margin-top:6px}
.btn-row .btn.ghost{background:var(--bg);color:var(--text);border:1px solid var(--line)}
.btn.inline{width:auto;padding:9px 26px;border-radius:20px;margin-top:12px}
.avatar{position:relative;width:42px;height:42px;border-radius:50%;overflow:hidden;display:flex;align-items:center;justify-content:center;font-size:20px;flex-shrink:0;color:#fff;font-weight:700}
.post-body{flex:1;min-width:0}
.who{font-weight:700;font-size:15px}
.meta{color:var(--sub);font-size:12px;font-weight:400;margin-left:6px}
.text{margin:6px 0 10px;white-space:pre-wrap;word-break:break-word;line-height:1.6}
.actions{display:flex;gap:24px}
.act{border:none;background:none;color:var(--sub);display:flex;align-items:center;gap:6px;font-size:14px;padding:4px 0}
.act:hover{color:var(--main)}
.act.liked{color:var(--red)}
.act.del:hover{color:var(--red)}
.comments{margin:12px 0 0 54px;border-left:2px solid var(--line);padding-left:12px}
.comment{padding:8px 0;font-size:14px}
.comment .who{font-size:13px}
.cform{display:flex;gap:8px;margin-top:8px}
.cform input{flex:1;min-width:0;padding:8px 12px;border:1px solid var(--line);border-radius:20px;outline:none}
.cform button{flex-shrink:0;white-space:nowrap;padding:8px 16px;border:none;border-radius:20px;background:var(--main);color:#fff;font-weight:700}
.empty{padding:60px 20px;text-align:center;color:var(--sub)}

/* notif / dm / profile */
.notif{padding:14px 20px;border-bottom:1px solid var(--line);display:flex;gap:12px;align-items:center}
.notif.new{background:rgba(139,124,246,.1)}
.conv{padding:14px 20px;border-bottom:1px solid var(--line);display:flex;gap:12px;align-items:center;cursor:pointer}
.conv:hover{background:var(--bg)}
.dm-new{display:flex;gap:8px;padding:14px 20px;border-bottom:8px solid var(--bg)}
.dm-new input{flex:1;padding:10px 12px;border:1px solid var(--line);border-radius:10px;outline:none}
.dm-new button{padding:10px 18px;border:none;border-radius:10px;background:var(--main);color:#fff;font-weight:700}
.chat{padding:16px 20px;display:flex;flex-direction:column;gap:8px;min-height:50vh}
.bubble{max-width:75%;padding:9px 14px;border-radius:16px;line-height:1.5;word-break:break-word;white-space:pre-wrap}
.bubble.me{align-self:flex-end;background:var(--main);color:#fff;border-bottom-right-radius:4px}
.bubble.you{align-self:flex-start;background:var(--line);border-bottom-left-radius:4px}
.chat-form{display:flex;gap:8px;padding:12px 16px;align-items:center;width:100%}
.chat-form input{flex:1;min-width:0;padding:10px 14px;border:1px solid var(--line);border-radius:20px;outline:none}
.chat-form .small-btn,.chat-form button{white-space:nowrap;flex-shrink:0}
.chat-form button{padding:10px 18px;border:none;border-radius:20px;background:var(--main);color:#fff;font-weight:700}
.back{border:none;background:none;color:var(--main);font-weight:700;padding:0;margin-right:10px}
.profile-top{padding:28px 20px;text-align:center;border-bottom:8px solid var(--bg)}
.profile-top .avatar{width:80px;height:80px;font-size:36px;margin:0 auto 12px}
.profile-top h2{margin:0}
.profile-top p{color:var(--sub);margin:4px 0}
.logout{margin-top:14px;padding:8px 20px;border:1px solid var(--line);background:var(--card);border-radius:20px;color:var(--red);font-weight:700}
.toast{position:fixed;left:50%;bottom:90px;transform:translateX(-50%);background:#2b3040;color:#fff;padding:10px 18px;border-radius:20px;font-size:14px;z-index:99;opacity:0;transition:.3s;pointer-events:none}
.toast.show{opacity:.92}

/* modal */
.modal-bg{position:fixed;inset:0;background:rgba(0,0,0,.65);display:flex;align-items:center;justify-content:center;z-index:50;padding:16px}
.modal{background:var(--card);border:1px solid var(--line);border-radius:16px;width:100%;max-width:520px}
.modal .compose{border:none}

@media(max-width:820px){
  #app{display:block}
  nav{position:fixed;bottom:0;top:auto;left:0;right:0;width:100%;height:auto;flex-direction:row;justify-content:space-around;border-right:none;border-top:1px solid var(--line);padding:4px;z-index:20}
  nav .logo,.nav-post{display:none}
  .nav-item{flex-direction:column;gap:2px;font-size:10px;padding:6px 8px;flex:1;align-items:center}
  .nav-item .badge{position:absolute;top:2px;right:18%;margin:0}
  main{max-width:none;border-right:none;padding-bottom:70px}
  .fab:not(.hidden){display:flex!important}
  .chat-bar{bottom:var(--navh,52px)}
}
.fab{display:none;position:fixed;right:16px;bottom:80px;width:54px;height:54px;border-radius:50%;background:var(--main);color:#fff;border:none;font-size:26px;align-items:center;justify-content:center;box-shadow:0 6px 20px rgba(0,0,0,.5);z-index:25}

/* v2 additions */
.img-prev{position:relative;display:inline-block;margin:6px 0}
.img-prev img{max-width:140px;max-height:140px;border-radius:10px;display:block}
.img-prev .x{position:absolute;top:4px;right:4px;width:24px;height:24px;border-radius:50%;border:none;background:rgba(0,0,0,.7);color:#fff;line-height:1}
.pimg{display:block;max-width:100%;max-height:420px;border-radius:12px;margin-top:8px;cursor:zoom-in;border:1px solid var(--line)}
.dimg{display:block;max-width:100%;max-height:300px;border-radius:10px;cursor:zoom-in}
.bubble.has-img{padding:6px}
.bubble.has-img .t{padding:6px 8px 2px}
.imgload{color:var(--sub);font-size:13px;padding:10px}
.lbimg{max-width:96vw;max-height:90vh;border-radius:8px;display:block}
.subtabs{display:flex;border-bottom:1px solid var(--line)}
.subtabs button{flex:1;padding:12px;border:none;background:none;color:var(--sub);font-weight:700;border-bottom:3px solid transparent}
.subtabs button.on{color:var(--text);border-bottom-color:var(--main)}
.stats{display:flex;justify-content:center;gap:20px;margin:10px 0;color:var(--sub);font-size:13px}
.stats b{color:var(--text);margin-right:3px}
.stats .lk{cursor:pointer}
.btn.following{background:var(--bg);color:var(--text);border:1px solid var(--line)}
.btn.danger{background:var(--red);color:#fff}
.btn.ghost-danger{background:none;border:1px solid var(--red);color:var(--red)}
.ulist{padding:6px 0;max-height:60vh;overflow:auto}
.chat-bar{position:sticky;bottom:0;background:var(--card);border-top:1px solid var(--line)}
.chat-bar .pv{padding:8px 20px 0}
.c-act{gap:16px;margin-top:2px}
.c-act .act{font-size:12px}
.comment.reply{margin-left:22px;padding-left:10px;border-left:2px solid var(--line)}
.replyto{font-size:12px;color:var(--sub);margin-top:2px}
.replyto b{color:var(--main2)}
.replying{font-size:12px;color:var(--sub);margin-top:8px}
.replying b{color:var(--main2)}
.replying button{border:none;background:none;color:var(--sub);font-size:14px;padding:0 4px}
.msg{display:flex;flex-direction:column;max-width:78%;gap:2px}
.msg.me{align-self:flex-end;align-items:flex-end}
.msg.you{align-self:flex-start;align-items:flex-start}
.msg .bubble{max-width:100%}
.quote{border-left:3px solid var(--main);background:var(--bg);color:var(--sub);font-size:12px;padding:3px 8px;border-radius:6px;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;cursor:pointer}
.quote b{color:var(--main2)}
.mmeta{font-size:11px;color:var(--sub)}
.rbtn{border:none;background:none;color:var(--sub);font-size:11px;padding:0}
.rbtn:hover{color:var(--main)}
.typing{padding:0 20px 8px;font-size:12px;color:var(--sub)}
.msg.flash{outline:2px solid var(--main);outline-offset:3px;border-radius:12px}
.gallery{display:grid;gap:3px;margin-top:8px;border-radius:12px;overflow:hidden;border:1px solid var(--line)}
.gallery.g1{grid-template-columns:1fr}
.gallery.g2,.gallery.g4{grid-template-columns:1fr 1fr}
.gallery.g3{grid-template-columns:1fr 1fr}
.gallery.g3 .gimg:first-child{grid-column:1 / span 2}
.gimg{width:100%;height:100%;object-fit:cover;display:block;cursor:zoom-in;background:var(--bg);aspect-ratio:1/1}
.gallery.g1 .gimg{aspect-ratio:auto;max-height:420px;object-fit:contain}
.gallery.g3 .gimg:first-child{aspect-ratio:2/1}
.img-prev{margin:6px 6px 0 0;vertical-align:top}
.lbn{position:fixed;top:50%;transform:translateY(-50%);width:44px;height:44px;border-radius:50%;border:none;background:rgba(0,0,0,.6);color:#fff;font-size:28px;line-height:1}
.lbn.l{left:12px}.lbn.r{right:12px}
.lbc{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);color:#fff;font-size:13px;background:rgba(0,0,0,.6);padding:3px 12px;border-radius:12px}
.act.static{cursor:default}.act.static:hover{color:var(--sub)}
.more{padding:16px;text-align:center}
.more .btn{width:auto;padding:10px 26px;background:var(--bg);color:var(--text);border:1px solid var(--line)}
.more.end{color:var(--sub);font-size:12px}
.dot{display:none;position:absolute;right:1px;bottom:1px;width:9px;height:9px;border-radius:50%;background:#3ddc84;border:2px solid var(--card);box-sizing:content-box}
.avatar.sm .dot{width:6px;height:6px;right:-1px;bottom:-1px;border-width:1.5px}
.dot.on{display:block}
.onltag{display:none;color:#3ddc84;font-size:12px;font-weight:700;margin-top:2px}
.onltag.on{display:block}
.tog{display:block;margin:12px 0 0;color:var(--sub);font-size:13px;cursor:pointer}
.tog input{margin-right:6px}
.onl-head{padding:12px 20px 4px;color:var(--sub);font-size:12px;font-weight:700}
.onl-list{display:flex;gap:8px;overflow-x:auto;padding:4px 20px 12px;border-bottom:1px solid var(--line)}
.onl-chip{display:flex;align-items:center;gap:2px;flex-shrink:0;padding:5px 12px 5px 6px;border:1px solid var(--line);border-radius:20px;background:var(--card);color:var(--text);font-size:13px}
</style>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.112.3/dist/umd/supabase.js"></script>
</head>
<body>

<!-- ログイン / 新規登録 -->
<div id="auth">
  <div class="auth-box">
    <h1 class="logo" style="margin-bottom:20px">filx</h1>
    <div class="tabs">
      <button id="tabLogin" class="on">ログイン</button>
      <button id="tabSignup">新規登録</button>
    </div>
    <form id="authForm" novalidate>
      <div class="field hidden" id="fName"><label>ユーザー名（DMで使う名前）</label><input id="aName" maxlength="40" placeholder="例：taro（絵文字もOK・15文字まで）"></div>
      <div class="field"><label>学校のメールアドレス</label><input id="aEmail" type="email" placeholder="xxxx@fzk.example.jp" autocomplete="username"></div>
      <div class="field"><label>パスワード（6文字以上）</label><input id="aPass" type="password" autocomplete="current-password"></div>
      <div class="err" id="aErr"></div>
      <button class="btn" id="aBtn">ログイン</button>
    </form>
    <p class="note">※ メールアドレスに「fzk」を含む人だけ登録できます。<br>※ 投稿を見た人は、投稿した人に表示されます。<br>※ オンライン中の人は、他の人に表示されます（プロフィールでオフにできます）。</p>
  </div>
</div>

<!-- アプリ本体 -->
<div id="app" class="hidden">
  <nav>
    <h1 class="logo">filx</h1>
    <button class="nav-item" data-view="home">ホーム</button>
    <button class="nav-item" data-view="notif">通知<span class="badge hidden" id="nBadge">0</span></button>
    <button class="nav-item" data-view="dm">DM<span class="badge hidden" id="dBadge">0</span></button>
    <button class="nav-item" data-view="me">プロフィール</button>
    <button class="btn nav-post" id="openCompose">ポストする</button>
  </nav>
  <main id="main"></main>
</div>
<button class="fab hidden" id="fab">＋</button>
<div class="toast" id="toast"></div>
<div id="modalHost"></div>

<script>
'use strict';
/* ========== 設定（Supabaseの「Project URL」と「Publishable key」） ========== */
const SUPABASE_URL = 'https://znrgfpvxcsbtodlkanfa.supabase.co';
const SUPABASE_KEY = 'sb_publishable_ZWu2zTuOCBvdMoPBnfU1Aw_DTMTWsMp';
const BUCKET = 'images';             // 画像の置き場所（非公開）

/* ========== 基本 ========== */
const $ = s => document.querySelector(s);
const esc = s => String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function hash(s){ let h = 5381; for(const c of String(s)) h = ((h<<5)+h) ^ c.charCodeAt(0); return h>>>0; }
const colors = ['#6c5ce7','#00b894','#e17055','#0984e3','#e84393','#d6a12e','#00cec9','#d63031'];
const colorOf = s => colors[hash(s) % colors.length];
function ago(ts){
  const s = (Date.now()-ts)/1000;
  if(s<60) return 'たった今'; if(s<3600) return Math.floor(s/60)+'分前';
  if(s<86400) return Math.floor(s/3600)+'時間前'; return Math.floor(s/86400)+'日前';
}
function toast(t){ const e=$('#toast'); e.textContent=t; e.classList.add('show'); clearTimeout(toast.t); toast.t=setTimeout(()=>e.classList.remove('show'),2400); }
const NAME_MAX = 15;
const NAME_BAD = /[\u0000-\u001f\u007f-\u009f\u00a0\u00ad\u1680\u180e\u2000-\u200c\u200e-\u202f\u205f-\u206f\u3000\ufeff\ufff9-\ufffc]/;
const NAME_MSG = '名前は15文字までです（改行や見えない文字は使えません）';
const NAME_RE = { test: n => { const c = [...String(n)].length; return c >= 1 && c <= NAME_MAX && n === n.trim() && !NAME_BAD.test(n); } };

/* アイコン（画像があれば画像、なければ頭文字） */
const AVRE = /^data:image\/jpeg;base64,[A-Za-z0-9+\/=]+$/;
const hasAv = u => !!(u.avatar && AVRE.test(u.avatar));
const avBG = u => hasAv(u) ? `background:url('${u.avatar}') center/cover` : `background:${colorOf(u.name||'?')}`;
const avTxt = u => (hasAv(u) ? '' : esc([...(u.name||'?')][0].toUpperCase())) + `<i class="dot" data-uid="${esc(u.id || '')}"></i>`;

/* エラー文を日本語にする */
function errMsg(e){
  const m = (e && e.message) || String(e);
  if(/Invalid login credentials/i.test(m)) return 'メールアドレスかパスワードが違います';
  if(/already registered|already been registered/i.test(m)) return 'このメールアドレスは登録済みです';
  if(/Database error saving new user/i.test(m)) return '登録できませんでした。メールアドレスに「fzk」が入っているか、ユーザー名を確認してください（削除されたアカウントのメールアドレスは使えません）';
  if(/rate limit|too many requests|over_request_rate/i.test(m)) return 'しばらく待ってからもう一度試してください';
  if(/Failed to fetch|NetworkError|Load failed/i.test(m)) return 'ネットにつながりません';
  if(/Password should be at least/i.test(m)) return 'パスワードは6文字以上にしてください';
  if(/profiles_name_uniq/i.test(m)) return 'その名前は使われています';
  if(/profiles_name_fmt/i.test(m)) return NAME_MSG;
  if(/text_or_image/i.test(m)) return '内容を入力してください';
  if(/follows_not_self/i.test(m)) return '自分はフォローできません';
  if(/maximum allowed size|payload too large|entity too large/i.test(m)) return '画像が大きすぎます';
  if(/mime type/i.test(m)) return 'この形式の画像は使えません';
  if(/row-level security|permission denied/i.test(m)) return 'この操作はできません';
  return m;
}
function fail(e){
  const m = (e && e.message) || '';
  if(/JWT|Invalid Refresh Token|not authenticated/i.test(m) && me){ doLogout(true); return 'ログインし直してください'; }
  return errMsg(e);
}
async function q(promise){ const r = await promise; if(r.error) throw r.error; return r.data; }
async function cnt(promise){ const r = await promise; if(r.error) throw r.error; return r.count || 0; }

/* ========== 状態 ========== */
let sb = null;
let me = null;                       // {id, email, name, bio, avatar}
let isAdmin = false;                 // 管理者か（画面の表示用。本当の判定はデータベース側）
const PROF = {};                     // ユーザー情報のキャッシュ
let view = 'home', homeTab = 'all', profileId = null, editing = false, pendingAvatar, dmWith = null;
const PAGE = 10;                       // タイムラインは10件ずつ読み込む
let feedMoreNext = false, feedLimit = PAGE, feedMore = false, feedCtx = '', profLimit = PAGE, profMore = false, profCtx = '', loadingMore = false;

async function ensureProfiles(ids){
  const now = Date.now();
  const need = [...new Set(ids)].filter(id => id && (!PROF[id] || now - PROF[id].t > 120000));
  if(!need.length) return;
  const rows = await q(sb.from('profiles').select('id,name,bio,avatar').in('id', need));
  rows.forEach(p => PROF[p.id] = Object.assign({}, p, { t: now }));
}
const normPost = p => ({
  id: p.id, text: p.text, images: p.image_paths || [], views: p.impressions || 0, cat: p.created_at, ts: Date.parse(p.created_at), uid: p.user_id,
  likes: (p.likes || []).map(l => l.user_id),
  comments: (p.comments || []).map(c => ({ id:c.id, text:c.text, ts:Date.parse(c.created_at), uid:c.user_id, parent:c.parent_id || null, likes:(c.comment_likes || []).map(l => l.user_id) })).sort((a,b)=>a.ts-b.ts)
});
const PSEL = 'id,text,image_paths,impressions,created_at,user_id,likes(user_id),comments(id,text,created_at,user_id,parent_id,comment_likes(user_id))';

/* ========== 画像（非公開の置き場所に保存し、見るときだけ期限つきのURLを発行） ========== */
const signed = {};                   // 保存場所 → {url, exp}
async function signPaths(paths){
  const now = Date.now();
  const need = [...new Set(paths)].filter(p => p && (!signed[p] || signed[p].exp - now < 600000));
  for(let i = 0; i < need.length; i += 50){
    const r = await sb.storage.from(BUCKET).createSignedUrls(need.slice(i, i + 50), 86400);
    if(r.error) throw r.error;
    (r.data || []).forEach(x => { if(x && x.signedUrl && x.path) signed[x.path] = { url: x.signedUrl, exp: now + 86400000 }; });
  }
}
const trySign = async paths => { try{ await signPaths(paths.filter(Boolean)); }catch(e){} };
const imgUrl = p => (signed[p] && signed[p].url) || '';
const imgTag = (path, cls) => { const u = imgUrl(path); return u ? `<img class="${cls}" src="${esc(u)}" alt="" loading="lazy" onclick="openImg(this.src)">` : `<div class="imgload">画像を読み込めません</div>`; };

function uuid4(){
  if(window.crypto && crypto.randomUUID) return crypto.randomUUID();
  const b = crypto.getRandomValues(new Uint8Array(16)); b[6] = (b[6] & 15) | 64; b[8] = (b[8] & 63) | 128;
  const h = [...b].map(x => x.toString(16).padStart(2, '0')).join('');
  return `${h.slice(0,8)}-${h.slice(8,12)}-${h.slice(12,16)}-${h.slice(16,20)}-${h.slice(20)}`;
}
function loadImg(file){
  return new Promise((res, rej) => {
    const u = URL.createObjectURL(file), i = new Image();
    i.onload = () => { URL.revokeObjectURL(u); res(i); };
    i.onerror = () => { URL.revokeObjectURL(u); rej(new Error('画像を読み込めませんでした')); };
    i.src = u;
  });
}
/* 選んだ画像を、長いほうの辺1280px・JPEGに小さくする（位置情報などの付加情報も消える） */
async function prepImage(file){
  if(!file || !/^image\//.test(file.type)) throw new Error('画像を選んでください');
  if(file.size > 40 * 1024 * 1024) throw new Error('画像が大きすぎます');
  const img = await loadImg(file);
  let side = 1280, quality = 0.82;
  for(let i = 0; i < 4; i++){
    const k = Math.min(1, side / Math.max(img.width, img.height));
    const w = Math.max(1, Math.round(img.width * k)), h = Math.max(1, Math.round(img.height * k));
    const c = document.createElement('canvas'); c.width = w; c.height = h;
    const x = c.getContext('2d'); x.fillStyle = '#fff'; x.fillRect(0, 0, w, h); x.drawImage(img, 0, 0, w, h);
    const blob = await new Promise(r => c.toBlob(r, 'image/jpeg', quality));
    if(blob && blob.size <= 2.5 * 1024 * 1024) return blob;
    side = Math.round(side * 0.75); quality = Math.max(0.55, quality - 0.1);
  }
  throw new Error('画像を小さくできませんでした');
}
async function uploadImg(blob){
  const path = `${me.id}/${uuid4()}.jpg`;
  const r = await sb.storage.from(BUCKET).upload(path, blob, { contentType:'image/jpeg', cacheControl:'31536000', upsert:false });
  if(r.error) throw r.error;
  return path;
}
const rmImg = path => Promise.resolve(sb.storage.from(BUCKET).remove([path])).catch(()=>{});

/* 添付する画像（投稿の入力欄 'main' 'm' は4枚まで、DM 'dm' は1枚） */
const cimg = {};                       // 入力欄ID → [{blob, url}, ...]
const maxImgs = id => id === 'dm' ? 1 : 4;
function showPrev(id){
  const pv = $('#pv-' + id); if(!pv) return;
  const list = cimg[id] || [];
  if(!list.length){ pv.classList.add('hidden'); pv.innerHTML = ''; return; }
  pv.classList.remove('hidden');
  pv.innerHTML = list.map((c, i) => `<div class="img-prev"><img src="${c.url}" alt=""><button type="button" class="x" onclick="dropImg('${id}', ${i})">×</button></div>`).join('') +
    (list.length > 1 || maxImgs(id) > 1 ? `<div class="meta" style="margin:0">${list.length}/${maxImgs(id)}枚</div>` : '');
}
function dropImg(id, idx){
  const list = cimg[id]; if(!list) { showPrev(id); return; }
  const gone = idx === undefined ? list.splice(0) : list.splice(idx, 1);
  gone.forEach(c => { try{ URL.revokeObjectURL(c.url); }catch(e){} });
  if(!list.length) delete cimg[id];
  showPrev(id);
}
function bindFile(id){
  const fin = $('#f-' + id); if(!fin) return;
  if(maxImgs(id) > 1) fin.multiple = true;
  fin.onchange = async () => {
    const files = [...fin.files]; fin.value = ''; if(!files.length) return;
    const max = maxImgs(id), have = (cimg[id] || []).length;
    let room = max - have, over = files.length > room;
    if(max === 1){ dropImg(id); room = 1; over = false; }
    for(const f of files.slice(0, Math.max(0, room))){
      try{
        const blob = await prepImage(f);
        (cimg[id] = cimg[id] || []).push({ blob, url: URL.createObjectURL(blob) });
        showPrev(id);
      }catch(e){ toast(e.message); }
    }
    if(over) toast('画像は' + max + '枚までです');
  };
  showPrev(id);
}
const galleries = {};                  // 投稿ID → 画像の保存場所の一覧（拡大表示で使う）
function galleryHTML(p){
  const ps = p.images || []; if(!ps.length) return '';
  galleries[p.id] = ps;
  const cells = ps.map((path, i) => { const u = imgUrl(path);
    return u ? `<img class="gimg" src="${esc(u)}" alt="" loading="lazy" onclick="openGallery('${p.id}', ${i})">` : `<div class="imgload">画像を読み込めません</div>`; }).join('');
  return `<div class="gallery g${ps.length}">${cells}</div>`;
}
let lbState = null;
function openGallery(pid, i){ lbState = { pid, i }; showLightbox(); }
function showLightbox(){
  const ps = galleries[lbState.pid] || [], u = imgUrl(ps[lbState.i]);
  const nav = ps.length > 1 ? `<button class="lbn l" onclick="event.stopPropagation();lbMove(-1)">‹</button><button class="lbn r" onclick="event.stopPropagation();lbMove(1)">›</button><div class="lbc">${lbState.i + 1} / ${ps.length}</div>` : '';
  $('#modalHost').innerHTML = `<div class="modal-bg" id="lb" onclick="closeModal()"><img class="lbimg" src="${esc(u)}" alt="">${nav}</div>`;
}
function lbMove(d){ const n = (galleries[lbState.pid] || []).length; if(!n) return; lbState.i = (lbState.i + d + n) % n; showLightbox(); }
document.addEventListener('keydown', e => { if(lbState && $('#lb')){ if(e.key === 'ArrowLeft') lbMove(-1); if(e.key === 'ArrowRight') lbMove(1); } });
function openImg(src){
  $('#modalHost').innerHTML = `<div class="modal-bg" id="lb" onclick="closeModal()"><img class="lbimg" src="${esc(src)}" alt=""></div>`;
}

  mode = m;

  $('#tabSignup').classList.toggle('on', m==='signup');
  $('#fName').classList.toggle('hidden', m==='login');

}

$('#authForm').onsubmit = async e => {
  e.preventDefault();
  const err = m => $('#aErr').textContent = m;
  if(!sb) return err(sbProblem || '設定がまだ終わっていません');
  const email = $('#aEmail').value.trim().toLowerCase();
  const password = $('#aPass').value;
  const name = $('#aName').value.trim();
  if(!email.includes('@')) return err('メールアドレスを正しく入力してください');
  if(password.length < 6) return err('パスワードは6文字以上にしてください');
  $('#aBtn').disabled = true; err('');
  try{
    if(mode === 'signup'){
      if(!email.includes('fzk')) throw new Error('校内専用です。メールアドレスに「fzk」を含む人だけ登録できます');
      if(!name) throw new Error('ユーザー名を入力してください');
      if(!NAME_RE.test(name)) throw new Error(NAME_MSG);
      const free = await q(sb.rpc('name_available', { n: name }));
      if(!free) throw new Error('そのユーザー名は使われています');
      const r = await sb.auth.signUp({ email, password, options: { data: { name } } });
      if(r.error) throw r.error;
      if(!r.data.session) throw new Error('登録を受け付けましたが、メールの確認が必要な設定になっています。管理者に Supabase の「Confirm email」をオフにしてもらってください');
    } else {
      const r = await sb.auth.signInWithPassword({ email, password });
      if(r.error) throw r.error;
    }
    await loadMe();
    start();
  }catch(ex){ err(errMsg(ex)); }
  $('#aBtn').disabled = false;
};

async function loadMe(){
  const { data } = await sb.auth.getSession();
  const user = data.session && data.session.user;
  if(!user) throw new Error('ログインできませんでした');
  const p = await q(sb.from('profiles').select('id,name,bio,avatar').eq('id', user.id).maybeSingle());
  if(!p) throw new Error('プロフィールが見つかりません');
  me = Object.assign({}, p, { email: user.email });
  PROF[me.id] = Object.assign({}, p, { t: Date.now() });
  try{ const r = await sb.rpc('is_admin'); isAdmin = r.data === true; }catch(e){ isAdmin = false; }
}

/* 画面を切り替える：読み込み中表示 → データ取得 → 描画 */
function go(){
  syncFab();
  const had = (view==='home' && feed.length) || (view==='me' && profile && profile.user.id===(profileId||me.id)) || (view==='notif' && notifs.length) || (view==='dm' && (dmWith ? chat : convs.length));
  if(!had) $('#main').innerHTML = (view==='home' ? homeTop() : headHTML(TITLES[view])) + '<div class="empty">読み込み中…</div>';
  chatShown = null;
  refresh(false);
}

async function refresh(silent){
  const v = view, pid = profileId, dw = dmWith, tab = homeTab;
  if(!me) return;
  try{
    if(v === 'home'){
      let rows;
      if(feedCtx !== 'home:' + tab){ feedCtx = 'home:' + tab; feedLimit = PAGE; }
      const lim = feedLimit;
      if(tab === 'following'){
        const f = await q(sb.from('follows').select('following_id').eq('follower_id', me.id));
        myFollowing = new Set(f.map(x => x.following_id));
        rows = await q(sb.from('posts').select(PSEL).in('user_id', [me.id, ...myFollowing]).order('created_at', { ascending:false }).limit(lim));
      } else {
        rows = await q(sb.from('posts').select(PSEL).order('created_at', { ascending:false }).limit(lim));
      }
      feedMoreNext = rows.length >= lim;
      const list = rows.map(normPost);
      await ensureProfiles(list.flatMap(p => [p.uid, ...p.comments.map(c => c.uid)]));
      await trySign(list.flatMap(p => p.images));
      if(view !== v || homeTab !== tab || !me) return;
      feed = list; feedMore = feedMoreNext;
    }
    else if(v === 'me'){
      const id = pid || me.id;
      if(profCtx !== 'me:' + id){ profCtx = 'me:' + id; profLimit = PAGE; }
      const plim = profLimit;
      const [rows, fers, fing, fol, npost, nlike] = await Promise.all([
        q(sb.from('posts').select(PSEL).eq('user_id', id).order('created_at', { ascending:false }).limit(plim)),
        cnt(sb.from('follows').select('follower_id', { count:'exact', head:true }).eq('following_id', id)),
        cnt(sb.from('follows').select('following_id', { count:'exact', head:true }).eq('follower_id', id)),
        id === me.id ? Promise.resolve(null) : q(sb.from('follows').select('following_id').eq('follower_id', me.id).eq('following_id', id).maybeSingle()),
        cnt(sb.from('posts').select('id', { count:'exact', head:true }).eq('user_id', id)),
        cnt(sb.from('likes').select('post_id,posts!inner(user_id)', { count:'exact', head:true }).eq('posts.user_id', id)).catch(() => -1)
      ]);
      PROF[id] && (PROF[id].t = 0);                 // プロフィールは毎回最新を取る
      await ensureProfiles([id]);
      const list = rows.map(normPost);
      await ensureProfiles(list.flatMap(p => p.comments.map(c => c.uid)));
      await trySign(list.flatMap(p => p.images));
      if(view !== v || profileId !== pid || !me) return;
      if(!PROF[id]) throw new Error('ユーザーが見つかりません');
      profile = { user: PROF[id], own: id === me.id, posts: list, nposts: npost, likes: nlike >= 0 ? nlike : list.reduce((s,p) => s + p.likes.length, 0), followers: fers, following: fing, followed: !!fol };
      profMore = rows.length >= plim;
    }
    else if(v === 'notif'){
      const rows = await q(sb.from('notifications').select('id,type,post_id,text,read,created_at,from_user,post:posts(text,image_paths)').order('created_at', { ascending:false }).limit(100));
      await ensureProfiles(rows.map(n => n.from_user));
      if(view !== v || !me) return;
      notifs = rows;
    }
    else if(v === 'dm'){
      if(dw){
        const rows = await q(sb.from('dms').select('id,from_user,to_user,text,image_path,created_at,read_at,reply_to')
          .or(`and(from_user.eq.${me.id},to_user.eq.${dw}),and(from_user.eq.${dw},to_user.eq.${me.id})`)
          .order('created_at', { ascending:false }).limit(200));
        await ensureProfiles([dw]);
        await trySign(rows.map(d => d.image_path));
        if(view !== v || dmWith !== dw || !me) return;
        const msgs = rows.reverse().map(d => ({ id:d.id, mine:d.from_user === me.id, text:d.text, image:d.image_path || null, ts:Date.parse(d.created_at), read:!!d.read_at, reply:d.reply_to || null }));
        const sig = msgs.map(m => m.id + (m.read ? 'r' : '')).join();
        const same = chat && chat.user.id === dw && chat.sig === sig;
        const near = window.innerHeight + window.scrollY >= document.body.scrollHeight - 150;
        const gotNew = chat && chat.user.id === dw && msgs.length > chat.messages.length && !msgs[msgs.length-1].mine;
        chat = { user: U(dw), messages: msgs, sig };
        if(gotNew) typingUntil = 0;
        markRead(dw);
        if(silent && chatShown === dw && $('#chatBody')){
          if(!same){ $('#chatBody').innerHTML = bubbles(); updateTyping(); if(near) window.scrollTo(0, document.body.scrollHeight); }
          return;
        }
      } else {
        const rows = await q(sb.from('dms').select('id,from_user,to_user,text,image_path,created_at').order('created_at', { ascending:false }).limit(300));
        const last = {};
        rows.forEach(d => { const o = d.from_user === me.id ? d.to_user : d.from_user; if(!last[o]) last[o] = d; });
        await ensureProfiles(Object.keys(last));
        if(view !== v || dmWith || !me) return;
        convs = Object.entries(last).map(([id,d]) => ({ user:U(id), text:d.text || '画像を送りました', ts:Date.parse(d.created_at) }));
      }
    }
  }catch(e){ if(!silent) toast(fail(e)); return; }
  render();
  if(v === 'dm' && dmWith){                       // 開いているチャットの相手からの通知は、読んだことにする
    sb.from('notifications').update({ read:true }).eq('read', false).eq('type', 'dm').eq('from_user', dmWith).then(() => pollSummary());
  }
  if(v === 'notif'){
    sb.from('notifications').update({ read:true }).eq('read', false).then(() => { unread = 0; unreadDM = 0; setBadge(); });
  }
}

function setBadge(){
  const bd = $('#nBadge'); bd.textContent = unread; bd.classList.toggle('hidden', !unread || view === 'notif');
  const dd = $('#dBadge'); if(dd){ dd.textContent = unreadDM; dd.classList.toggle('hidden', !unreadDM || view === 'dm'); }
  document.title = (unread ? '(' + unread + ') ' : '') + 'filx';
}

function render(){
  if(!me) return;
  syncFab();
  document.querySelectorAll('.nav-item').forEach(b => b.classList.toggle('on', b.dataset.view === view && (view !== 'me' || !profileId || profileId === me.id)));
  setBadge();
  syncTyping();
  const m = $('#main');
  if(view !== 'dm' || !dmWith) chatShown = null;
  if(view === 'home'){
    const old = $('#t-main'), keep = old ? old.value : '';        // 書きかけの文章は消さない
    const none = homeTab === 'following' && myFollowing.size === 0;
    m.innerHTML = homeTop() + composeHTML('main') +
      (none ? '<div class="empty">まだ誰もフォローしていません<br>投稿のアイコンからプロフィールを開いて、フォローしてみよう</div>' : feedHTML(feed, feedMore));
    bindCompose('main');
    if(keep){ $('#t-main').value = keep; $('#n-main').textContent = keep.length + '/200'; }
  }
  else if(view === 'notif') m.innerHTML = headHTML('通知') + notifHTML();
  else if(view === 'dm') dmWith ? renderChat(m) : renderConvs(m);
  else if(view === 'me') renderProfile(m);
  if(pendingScroll && view === 'home'){
    const e = $('#p-' + pendingScroll);
    if(e) e.scrollIntoView({ block:'center' }); else toast('この投稿は見つかりませんでした');
    pendingScroll = null;
  }
  observePosts(); observeMore(); paintOnline();
}

/* ========== 投稿フォーム ========== */
function composeHTML(id){
  return `<div class="compose" id="cmp-${id}">
    <textarea id="t-${id}" maxlength="200" placeholder="いま、どうしてる？"></textarea>
    <div class="pv hidden" id="pv-${id}"></div>
    <div class="compose-row">
      <label class="small-btn">画像<input type="file" accept="image/*" hidden id="f-${id}"></label>
      <span class="count" id="n-${id}">0/200</span>
      <button class="btn send" id="s-${id}">ポスト</button>
    </div></div>`;
}
function bindCompose(id, after){
  const t = $('#t-'+id); if(!t) return;
  t.oninput = () => $('#n-'+id).textContent = t.value.length + '/200';
  bindFile(id);
  $('#s-'+id).onclick = async () => {
    const text = t.value.trim(), list = (cimg[id] || []).slice();
    if(!text && !list.length) return toast('文章か画像を入れてください');
    const btn = $('#s-'+id); btn.disabled = true;
    const paths = [];
    try{
      for(const c of list) paths.push(await uploadImg(c.blob));
      await q(sb.from('posts').insert({ user_id: me.id, text, image_paths: paths }));
      dropImg(id);
      if(after) after();
      view = 'home'; dmWith = null; go(); window.scrollTo(0,0); toast('投稿しました');
    }catch(e){ paths.forEach(rmImg); toast(fail(e)); btn.disabled = false; }
  };
}
function openComposeModal(){
  dropImg('m');
  $('#modalHost').innerHTML = `<div class="modal-bg" id="mbg"><div class="modal">${composeHTML('m')}</div></div>`;
  $('#mbg').onclick = e => { if(e.target.id === 'mbg') closeModal(); };
  bindCompose('m', closeModal);
  $('#t-m').focus();

function feedHTML(list, more){

/* 下までスクロールしたら、次の10件を読み込む */
async function loadMore(){
  if(loadingMore || !me) return;
  const v = view, tab = homeTab, pid = profileId;
  const isHome = v === 'home', isProf = v === 'me';
  if(!isHome && !isProf) return;
  const base = isHome ? feed : (profile ? profile.posts : []);
  if(!base.length) return;
  loadingMore = true; const b = $('#moreSentinel button'); if(b) b.textContent = '読み込み中…';
  try{
    const before = base[base.length - 1].cat;
    let qy = sb.from('posts').select(PSEL);
    if(isHome){
      if(tab === 'following') qy = qy.in('user_id', [me.id, ...myFollowing]);
    } else qy = qy.eq('user_id', pid || me.id);
    const rows = await q(qy.lt('created_at', before).order('created_at', { ascending:false }).limit(PAGE));
    const list = rows.map(normPost);
    await ensureProfiles(list.flatMap(p => [p.uid, ...p.comments.map(c => c.uid)]));
    await trySign(list.flatMap(p => p.images));
    if(view !== v || homeTab !== tab || profileId !== pid || !me) return;
    const target = isHome ? feed : profile.posts;
    const have = new Set(target.map(p => p.id));
    list.forEach(p => { if(!have.has(p.id)) target.push(p); });
    if(isHome){ feedLimit = target.length; feedMore = rows.length >= PAGE; }
    else { profLimit = target.length; profMore = rows.length >= PAGE; }
  }catch(e){ toast(fail(e)); }
  finally{ loadingMore = false; }
  render();
}
let moreObs = null;
function observeMore(){
  const el = $('#moreSentinel'); if(!el || !window.IntersectionObserver) return;
  if(!moreObs) moreObs = new IntersectionObserver(es => { if(es.some(e => e.isIntersecting)) loadMore(); }, { rootMargin: '500px' });
  moreObs.disconnect(); moreObs.observe(el);
}
function postHTML(p){
  const a = U(p.uid), open = openComments.has(p.id), mine = p.uid === me.id;
  const liked = p.likes.includes(me.id);
  return `<div class="post" id="p-${p.id}" data-pid="${p.id}" data-mine="${mine ? 1 : 0}">
    <div class="post-top">

      <div class="post-body">

          ${mine || isAdmin ? `<button class="act" onclick="showViewers('${p.id}')" title="見た人を見る">👁 ${p.views}</button>` : `<span class="act static" title="表示された回数">👁 ${p.views}</span>`}
          ${mine ? `<button class="act del" onclick="delPost('${p.id}')">🗑 削除</button>`
                 : (isAdmin ? `<button class="act del" onclick="delPost('${p.id}')">🗑 削除（管理者）</button>` : '')}
        </div>

}
const replyTo = {};                  // 投稿ID → 返信しようとしているコメントID
function commentHTML(p, c, parentName){
  const a = U(c.uid), liked = c.likes.includes(me.id);
  const del = c.uid === me.id ? `<button class="act del" onclick="delComment('${p.id}','${c.id}')">削除</button>`
            : (isAdmin ? `<button class="act del" onclick="delComment('${p.id}','${c.id}')">削除（管理者）</button>` : '');
  const to = parentName ? `<div class="replyto">↪ <b>@${esc(parentName)}</b> への返信</div>` : '';
  return `<div class="comment${parentName ? ' reply' : ''}" id="c-${c.id}"><span class="avatar sm link" style="${avBG(a)}" onclick="openProfile('${a.id}')">${avTxt(a)}</span><span class="who link" onclick="openProfile('${a.id}')">${esc(a.name)}</span><span class="meta">${ago(c.ts)}</span>${to}<div class="text" style="margin:2px 0 0">${esc(c.text)}</div><div class="actions c-act"><button class="act ${liked?'liked':''}" onclick="toggleCommentLike('${p.id}','${c.id}')">${liked?'❤️':'🤍'} ${c.likes.length}</button><button class="act" onclick="startReply('${p.id}','${c.id}')">返信</button>${del}</div></div>`;
}
function commentsHTML(p){
  const byId = {}; p.comments.forEach(c => byId[c.id] = c);
  const kids = {}; const roots = [];
  p.comments.forEach(c => { if(c.parent && byId[c.parent]) (kids[c.parent] = kids[c.parent] || []).push(c); else roots.push(c); });
  const parts = [];
  roots.forEach(r => {
    parts.push(commentHTML(p, r, null));
    const q2 = [...(kids[r.id] || [])], out = [];            // 返信は、元のコメントの下に時間順で並べる
    while(q2.length){ const c = q2.shift(); out.push(c); (kids[c.id] || []).forEach(k => q2.push(k)); }
    out.sort((x, y) => x.ts - y.ts).forEach(c => parts.push(commentHTML(p, c, U(byId[c.parent].uid).name)));
  });
  const rt = replyTo[p.id] && byId[replyTo[p.id]];
  if(replyTo[p.id] && !rt) delete replyTo[p.id];
  const hint = rt ? `<div class="replying">↪ <b>@${esc(U(rt.uid).name)}</b> に返信中 <button onclick="cancelReply('${p.id}')">×</button></div>` : '';
  return `<div class="comments">${parts.join('') || '<div class="meta" style="margin:0">最初のコメントを書いてみよう</div>'}
    ${hint}<div class="cform"><input id="ci-${p.id}" maxlength="100" placeholder="${rt ? '返信を書く' : 'コメントする'}" onkeydown="if(event.key==='Enter')addComment('${p.id}')"><button onclick="addComment('${p.id}')">送信</button></div></div>`;
}

  allPosts().filter(x => x.id === id).forEach(p => { p.likes = was ? p.likes.filter(u => u !== me.id) : p.likes.concat(me.id); });

/* ========== インプレッション（画面に半分以上、1秒以上表示された他人の投稿を数える） ========== */
const impSeen = new Set(), impQueue = new Set(), impTimers = {};
let impObs = null;
function observePosts(){
  if(!me || !window.IntersectionObserver) return;
  if(!impObs) impObs = new IntersectionObserver(es => es.forEach(en => {
    const pid = en.target.dataset.pid; if(!pid) return;
    if(en.isIntersecting && en.intersectionRatio >= 0.5){
      if(impSeen.has(pid) || impTimers[pid]) return;
      impTimers[pid] = setTimeout(() => { delete impTimers[pid]; if(!document.hidden && !impSeen.has(pid)){ impSeen.add(pid); impQueue.add(pid); } }, 1000);
    } else if(impTimers[pid]){ clearTimeout(impTimers[pid]); delete impTimers[pid]; }
  }), { threshold: [0, 0.5, 1] });
  impObs.disconnect();
  Object.keys(impTimers).forEach(k => { clearTimeout(impTimers[k]); delete impTimers[k]; });
  document.querySelectorAll('#main .post[data-pid]').forEach(el => { if(el.dataset.mine !== '1' && !impSeen.has(el.dataset.pid)) impObs.observe(el); });
}
async function flushImpressions(){
  if(!me || !impQueue.size) return;
  const ids = [...impQueue].slice(0, 30); ids.forEach(i => impQueue.delete(i));
  try{ const r = await sb.rpc('record_impressions', { ids }); if(r.error) throw r.error; }
  catch(e){ ids.forEach(i => impSeen.delete(i)); }          // 失敗したら、あとでもう一度数える
}
setInterval(flushImpressions, 4000);

/* 入力中の表示（文字そのものは送らず、「いま打っている」という合図だけを相手に届ける） */
let typingCh = null, typingKey = '', typingUntil = 0, typingTimer = null, lastTypingSent = 0;
function syncTyping(){
  const want = (view === 'dm' && dmWith && me) ? [me.id, dmWith].sort().join('_') : '';
  if(want === typingKey) return;
  if(typingCh){ try{ sb.removeChannel(typingCh); }catch(e){} typingCh = null; }
  typingKey = want; typingUntil = 0; lastTypingSent = 0;
  if(!want || !sb.channel) return;
  try{
    const peer = dmWith;
    typingCh = sb.channel('typing:' + want, { config:{ broadcast:{ self:false } } });
    typingCh.on('broadcast', { event:'typing' }, msg => {
      if(msg && msg.payload && msg.payload.from === peer){ typingUntil = Date.now() + 4000; updateTyping(); }
    }).subscribe();
  }catch(e){ typingCh = null; }
}
function updateTyping(){
  const el = $('#typing'); if(!el) return;
  const on = Date.now() < typingUntil;
  el.classList.toggle('hidden', !on);
  el.textContent = on ? (chat ? chat.user.name : '') + 'さんが入力中…' : '';
  clearTimeout(typingTimer);
  if(on) typingTimer = setTimeout(updateTyping, Math.max(200, typingUntil - Date.now() + 50));
}
function sendTyping(){
  const now = Date.now();
  if(!typingCh || now - lastTypingSent < 2000) return;
  const v = $('#dmText'); if(!v || !v.value) return;
  lastTypingSent = now;
  try{ typingCh.send({ type:'broadcast', event:'typing', payload:{ from: me.id } }); }catch(e){}
}

/* ========== プロフィール・フォロー ========== */
function openProfile(id){ closeModal(); profileId = id; editing = false; view = 'me'; dmWith = null; go(); window.scrollTo(0,0); }
function startEdit(){ editing = true; pendingAvatar = undefined; render(); }
function cancelEdit(){ editing = false; render(); }
function pickAvatar(inp){
  const f = inp.files[0]; if(!f) return;
  if(!f.type.startsWith('image/')) return toast('画像を選んでください');
  const r = new FileReader();
  r.onload = () => {
    const img = new Image();
    img.onload = () => {
      const S = 96, c = document.createElement('canvas'); c.width = c.height = S;
      const m = Math.min(img.width, img.height);
      const x = c.getContext('2d');
      x.fillStyle = '#fff'; x.fillRect(0, 0, S, S);
      x.drawImage(img, (img.width-m)/2, (img.height-m)/2, m, m, 0, 0, S, S);
      pendingAvatar = c.toDataURL('image/jpeg', 0.75);
      const p = $('#avPrev'); p.style.background = `url('${pendingAvatar}') center/cover`; p.textContent = '';
    };
    img.onerror = () => toast('画像を読み込めませんでした');
    img.src = r.result;
  };
  r.readAsDataURL(f);
}
function removeAvatar(){
  pendingAvatar = '';
  const p = $('#avPrev'); p.style.background = colorOf(me.name); p.textContent = me.name[0].toUpperCase();
}
async function saveProfile(){
  const name = $('#eName').value.trim(), bio = $('#eBio').value.trim();
  if(!name) return toast('名前を入力してください');
  if(!NAME_RE.test(name)) return toast(NAME_MSG);
  const body = { name, bio };
  if(pendingAvatar !== undefined) body.avatar = pendingAvatar || null;
  try{
    await q(sb.from('profiles').update(body).eq('id', me.id));
    me = Object.assign({}, me, body); PROF[me.id] = Object.assign({}, me, { t: 0 });
    pendingAvatar = undefined; editing = false;
    await refresh(true); toast('保存しました');
  }catch(e){ toast(fail(e)); }
}
async function toggleFollow(id){
  if(!profile || profile.user.id !== id) return;
  const was = profile.followed;
  profile.followed = !was; profile.followers += was ? -1 : 1; render();
  try{
    if(was) await q(sb.from('follows').delete().eq('follower_id', me.id).eq('following_id', id));
    else await q(sb.from('follows').insert({ follower_id: me.id, following_id: id }));
    if(was) myFollowing.delete(id); else myFollowing.add(id);
  }catch(e){ toast(fail(e)); refresh(true); }
}
async function showFollows(id, kind){
  try{
    const col = kind === 'followers' ? 'follower_id' : 'following_id';
    const key = kind === 'followers' ? 'following_id' : 'follower_id';
    const rows = await q(sb.from('follows').select(col).eq(key, id).order('created_at', { ascending:false }).limit(200));
    await ensureProfiles(rows.map(r => r[col]));
    const items = rows.map(r => { const u = U(r[col]); return `<div class="conv" onclick="openProfile('${u.id}')"><div class="avatar" style="${avBG(u)}">${avTxt(u)}</div><div style="min-width:0"><b>${esc(u.name)}</b>${u.bio ? `<br><span class="meta" style="margin:0">${esc(u.bio.slice(0,40))}</span>` : ''}</div></div>`; }).join('');
    $('#modalHost').innerHTML = `<div class="modal-bg" id="mbg"><div class="modal"><div class="head" style="position:static">${kind === 'followers' ? 'フォロワー' : 'フォロー中'}</div><div class="ulist">${items || '<div class="empty">まだいません</div>'}</div></div></div>`;
    $('#mbg').onclick = e => { if(e.target.id === 'mbg') closeModal(); };
  }catch(e){ toast(fail(e)); }
}
/* 管理者だけ：アカウントを削除（その人の投稿・コメント・DM・フォロー・画像もすべて消える） */
async function purgeFolder(uid){
  for(let i = 0; i < 30; i++){
    const r = await sb.storage.from(BUCKET).list(uid, { limit: 100 });
    if(r.error || !r.data || !r.data.length) return;
    const names = r.data.filter(x => x && x.name).map(x => `${uid}/${x.name}`);
    if(!names.length) return;
    const d = await sb.storage.from(BUCKET).remove(names);
    if(d.error) return;
  }
}
async function adminDeleteUser(id){
  if(!isAdmin) return;
  const u = U(id);
  if(!confirm(`管理者として、「${u.name}」のアカウントを削除します。\n投稿・コメント・いいね・フォロー・DM・画像など、この人のデータがすべて消えます。元に戻せません。`)) return;
  try{
    await purgeFolder(id);
    await q(sb.rpc('admin_delete_user', { target: id }));
    delete PROF[id]; profile = null; myFollowing.delete(id);
    toast('アカウントを削除しました');
    view = 'home'; dmWith = null; profileId = me.id; go(); window.scrollTo(0,0);
  }catch(e){ toast(fail(e)); }
}
function renderProfile(m){
  if(!profile) return;
  const u = profile.user, own = profile.own;
  let top;
  if(own && editing){
    top = `<div class="profile-top"><div class="edit">
      <div class="avatar" id="avPrev" style="${avBG(u)}">${avTxt(u)}</div>
      <div class="edit-btns"><label class="small-btn">画像を選ぶ<input type="file" accept="image/*" hidden onchange="pickAvatar(this)"></label><button class="small-btn" onclick="removeAvatar()">画像を削除</button></div>
      <div class="field"><label>名前</label><input id="eName" maxlength="40" value="${esc(u.name)}"></div>
      <div class="field"><label>ステータスメッセージ</label><textarea id="eBio" maxlength="80" rows="3" placeholder="ひとこと書いてみよう">${esc(u.bio||'')}</textarea></div>
      <div class="btn-row"><button class="btn ghost" onclick="cancelEdit()">キャンセル</button><button class="btn" onclick="saveProfile()">保存</button></div>
    </div></div>`;
  } else {
    top = `<div class="profile-top">
      <div class="avatar" style="${avBG(u)}">${avTxt(u)}</div>
      <h2>${esc(u.name)}</h2>
      <div class="onltag" data-uid="${esc(u.id)}">● オンライン</div>
      ${own ? `<p>${esc(me.email || '')}</p>` : ''}
      <p class="bio">${u.bio ? esc(u.bio) : (own ? '<span style="color:var(--sub)">ステータスメッセージはまだありません</span>' : '')}</p>
      <div class="stats">
        <span><b>${profile.nposts}</b> 投稿</span>
        <span class="lk" onclick="showFollows('${u.id}','following')"><b>${profile.following}</b> フォロー中</span>
        <span class="lk" onclick="showFollows('${u.id}','followers')"><b>${profile.followers}</b> フォロワー</span>
        <span><b>${profile.likes}</b> いいね</span>
      </div>
      ${own ? `<div class="btn-row" style="justify-content:center"><button class="btn inline" onclick="startEdit()">プロフィールを編集</button></div><label class="tog"><input type="checkbox" ${showOnline ? 'checked' : ''} onchange="setShowOnline(this.checked)"> オンライン中であることを他の人に表示する</label><button class="logout" onclick="logout()">ログアウト</button>`
            : `<div class="btn-row" style="justify-content:center;flex-wrap:wrap">
                 <button class="btn inline ${profile.followed?'following':''}" onclick="toggleFollow('${u.id}')">${profile.followed ? 'フォロー中（タップで解除）' : 'フォローする'}</button>
                 <button class="btn inline" onclick="openChat('${u.id}')">DMを送信</button>
               </div>
               ${isAdmin ? `<div><button class="btn inline ghost-danger" onclick="adminDeleteUser('${u.id}')">このアカウントを削除（管理者）</button></div>` : ''}`}
    </div>`;
  }
  m.innerHTML = headHTML(own ? 'プロフィール' : esc(u.name)) + top +
    `<div class="head" style="position:static;font-size:15px">${own ? '自分の投稿' : '投稿'}</div>` + feedHTML(profile.posts, profMore);
}

/* ========== オンライン表示（いまアプリを開いている人） ========== */
let showOnline = true;
try{ showOnline = localStorage.getItem('filx_online') !== '0'; }catch(e){}
let onCh = null, onlineIds = new Set();
function startPresence(){
  stopPresence();
  if(!me || !sb || !sb.channel) return;
  try{
    onCh = sb.channel('filx-online', { config:{ presence:{ key: me.id } } });
    onCh.on('presence', { event:'sync' }, syncOnline);
    onCh.subscribe(st => { if(st === 'SUBSCRIBED') trackOnline(); });
  }catch(e){ onCh = null; }
}
function stopPresence(){
  if(onCh){ try{ sb.removeChannel(onCh); }catch(e){} onCh = null; }
  onlineIds = new Set();
}
function trackOnline(){
  if(!onCh) return;
  try{
    if(showOnline && !document.hidden) onCh.track({ at: Date.now() });
    else onCh.untrack();
  }catch(e){}
}
function setShowOnline(v){
  showOnline = !!v;
  try{ localStorage.setItem('filx_online', v ? '1' : '0'); }catch(e){}
  trackOnline(); toast(v ? 'オンライン中であることを表示します' : 'オンライン中であることを表示しません');
}
function syncOnline(){
  if(!onCh || !me) return;
  let st = {}; try{ st = onCh.presenceState() || {}; }catch(e){}
  onlineIds = new Set(Object.keys(st));
  ensureProfiles([...onlineIds].filter(id => id !== me.id).slice(0, 60)).catch(() => {}).then(paintOnline);
}
function paintOnline(){
  if(!me) return;
  document.querySelectorAll('.dot[data-uid],.onltag[data-uid]').forEach(el => el.classList.toggle('on', onlineIds.has(el.dataset.uid)));
  const box = $('#onlineBox'); if(!box) return;
  const others = [...onlineIds].filter(id => id !== me.id && PROF[id]);
  box.innerHTML = others.length
    ? `<div class="onl-head">オンライン中（${others.length}人）</div><div class="onl-list">${others.map(id => { const u = U(id); return `<button class="onl-chip" onclick="openChat('${esc(id)}')"><span class="avatar sm" style="${avBG(u)}">${avTxt(u)}</span>${esc(u.name)}</button>`; }).join('')}</div>`
    : `<div class="onl-head">いまオンラインの人はいません</div>`;
}
document.addEventListener('visibilitychange', trackOnline);

/* ========== 自動更新（新しい通知・投稿・DMを数秒ごとに取り込む） ========== */
async function pollSummary(){
  if(!me) return;
  try{
    const [r, r2] = await Promise.all([
      sb.from('notifications').select('id', { count:'exact', head:true }).eq('read', false),
      sb.from('notifications').select('id', { count:'exact', head:true }).eq('read', false).eq('type', 'dm')
    ]);
    if(r.error) throw r.error;
    const n = r.count || 0, d = r2.error ? 0 : (r2.count || 0);
    if(!document.hidden){
      if(d > unreadDM && !(view === 'dm' && dmWith)) toast('新しいメッセージが届きました');
      else if(n > unread && view !== 'notif' && !(view === 'dm' && dmWith)) toast('新しい通知があります');
    }
    unread = n; unreadDM = d; setBadge();
  }catch(e){}
}
const isBusy = () => {
  if(editing || $('#modalHost').innerHTML || Object.keys(cimg).some(k => (cimg[k] || []).length)) return true;
  const ae = document.activeElement;
  if(ae && (ae.tagName === 'INPUT' || ae.tagName === 'TEXTAREA')) return true;
  return [...document.querySelectorAll('#main input[type=text],#main input:not([type]),#main textarea')].some(x => x.value);
};
let hiddenTick = 0;
setInterval(() => {
  if(!me) return;
  if(document.hidden){ if(++hiddenTick % 3 === 0) pollSummary(); return; }   // 別タブにいる間は15秒ごとに件数だけ確認（タブの題名に出る）
  pollSummary();
  if(view === 'dm' && dmWith) refresh(true);     // チャットは入力中でも新着だけ差し込む
  else if(!isBusy()) refresh(true);
}, 5000);
document.addEventListener('visibilitychange', () => { if(!document.hidden && me){ pollSummary(); if(!isBusy()) refresh(true); } });

/* ========== 起動 ========== */
let sbProblem = '';
(async () => {
  setMode('login');
  if(!window.supabase){ sbProblem = '部品を読み込めませんでした。ネットにつながっているか確認してください'; $('#aErr').textContent = sbProblem; return; }
  if(SUPABASE_URL.startsWith('__') || SUPABASE_KEY.startsWith('__')){ sbProblem = '設定がまだ終わっていません（index.html の SUPABASE_URL と SUPABASE_KEY を入れてください）'; $('#aErr').textContent = sbProblem; return; }
  try{ sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY); }
  catch(e){ sbProblem = '設定が正しくありません: ' + e.message; $('#aErr').textContent = sbProblem; return; }
  sb.auth.onAuthStateChange(ev => { if(ev === 'SIGNED_OUT' && me) doLogout(true); });
  try{
    const { data } = await sb.auth.getSession();
    if(!data.session) return;
    $('#auth').classList.add('hidden');
    await loadMe(); start();
  }catch(e){
    $('#auth').classList.remove('hidden');
    if(/Failed to fetch|NetworkError|Load failed/i.test(e.message || '')) $('#aErr').textContent = 'ネットにつながりません';
  }
})();

</script></body></html>
